name: oc-js-patch
on:
  push:
    paths:
      - '.github/workflows/oc-js-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch upgrade hint
        run: |
          f=scripts/onecloud/10_system.js
          before=$(md5sum "$f" | cut -d' ' -f1)
          sed -i 's|　终端预检: sh /tmp/oc-upgrade.sh --check；有新固件时执行: sh /tmp/oc-upgrade.sh --reboot|　检测: upgrade --check　升级: upgrade --reboot|' "$f"
          after=$(md5sum "$f" | cut -d' ' -f1)
          echo "before=$before after=$after"
          if [ "$before" = "$after" ]; then echo "::error::未匹配到目标字符串"; exit 1; fi
          grep -c '检测: upgrade --check' "$f"
      - name: Commit and push
        run: |
          git config user.name "oc-bot"
          git config user.email "oc-bot@users.noreply.github.com"
          git add scripts/onecloud/10_system.js
          git commit -m "feat(onecloud): 概览页升级通道提示精简为 upgrade --check / --reboot"
          git push
