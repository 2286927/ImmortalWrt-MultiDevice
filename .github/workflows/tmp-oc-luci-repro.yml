name: tmp-oc-luci-repro-v3

on:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup binfmt for arm
        run: |
          ls /proc/sys/fs/binfmt_misc/ || sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          curl -sL --retry 3 -o qemu.tar.gz "https://github.com/multiarch/qemu-user-static/releases/download/v7.2.0-1/qemu-arm-static.tar.gz"
          tar -xzf qemu.tar.gz
          sudo cp qemu-arm-static /usr/local/bin/qemu-arm-static
          printf ':qemu-arm:M::\x7fELF\x01\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x28\x00:\xff\xff\xff\xff\xff\xff\xff\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\xff\xff\xff\xff:/usr/local/bin/qemu-arm-static:\n' | sudo tee /proc/sys/fs/binfmt_misc/register
          ls /proc/sys/fs/binfmt_misc/

      - name: Repro NEW (26.10.27) on 8080
        run: |
          set -x
          curl -sL --retry 3 -o rootfs-new.tar.gz "https://github.com/2286927/ImmortalWrt-MultiDevice/releases/download/OneCloud_openwrt-25.12_26.10.27_19.30.58/immortalwrt-amlogic-meson8b-thunder-onecloud-rootfs.tar.gz"
          mkdir rfs-new && tar -xzf rootfs-new.tar.gz -C rfs-new
          sudo mkdir -p rfs-new/proc rfs-new/dev
          sudo mount --bind /proc rfs-new/proc || true
          sudo mount --bind /dev rfs-new/dev || true
          sudo chroot rfs-new /usr/sbin/ubusd > ubusd-new.log 2>&1 &
          sleep 1
          sudo chroot rfs-new /usr/sbin/uhttpd -f -p 0.0.0.0:8080 -h /www -c /etc/config/uhttpd > uhttpd-new.log 2>&1 &
          sleep 4
          echo "===== NEW GET / ====="
          curl -s -o /dev/null -w "HTTP_CODE=%{http_code}\n" http://127.0.0.1:8080/ || true
          echo "===== NEW GET /cgi-bin/luci/ ====="
          curl -s -o /tmp/luci-new.html -D /tmp/luci-new.hdr -w "HTTP_CODE=%{http_code}\n" http://127.0.0.1:8080/cgi-bin/luci/ || true
          cat /tmp/luci-new.hdr || true
          echo "===== NEW BODY 400B ====="
          head -c 400 /tmp/luci-new.html || true; echo
          echo "===== NEW uhttpd.log ====="; cat uhttpd-new.log || true

      - name: Repro OLD (26.10.24) on 8081
        run: |
          set -x
          curl -sL --retry 3 -o rootfs-old.tar.gz "https://github.com/2286927/ImmortalWrt-MultiDevice/releases/download/OneCloud_openwrt-25.12_26.10.24_06.35.50/immortalwrt-amlogic-meson8b-thunder-onecloud-rootfs.tar.gz"
          mkdir rfs-old && tar -xzf rootfs-old.tar.gz -C rfs-old
          sudo mkdir -p rfs-old/proc rfs-old/dev
          sudo mount --bind /proc rfs-old/proc || true
          sudo mount --bind /dev rfs-old/dev || true
          sudo chroot rfs-old /usr/sbin/ubusd > ubusd-old.log 2>&1 &
          sleep 1
          sudo chroot rfs-old /usr/sbin/uhttpd -f -p 0.0.0.0:8081 -h /www -c /etc/config/uhttpd > uhttpd-old.log 2>&1 &
          sleep 4
          echo "===== OLD GET / ====="
          curl -s -o /dev/null -w "HTTP_CODE=%{http_code}\n" http://127.0.0.1:8081/ || true
          echo "===== OLD GET /cgi-bin/luci/ ====="
          curl -s -o /tmp/luci-old.html -D /tmp/luci-old.hdr -w "HTTP_CODE=%{http_code}\n" http://127.0.0.1:8081/cgi-bin/luci/ || true
          cat /tmp/luci-old.hdr || true
          echo "===== OLD BODY 400B ====="
          head -c 400 /tmp/luci-old.html || true; echo

      - name: Dump menu auth structures
        run: |
          echo "===== NEW menu.d admin/index auth ====="
          python3 - << 'PYEOF'
          import json, glob
          for tag, d in (("NEW","rfs-new"),("OLD","rfs-old")):
              for f in sorted(glob.glob(f"{d}/usr/share/luci/menu.d/*.json")):
                  try:
                      j = json.load(open(f))
                  except Exception as e:
                      print(tag, f, "JSON_ERROR", e); continue
                  def walk(o, path=""):
                      if isinstance(o, dict):
                          if "admin/index" in path and ("auth" in o or "login" in str(o)[:200]):
                              print(tag, f, path, "auth=", json.dumps(o.get("auth")))
                          for k, v in o.items(): walk(v, path+"/"+k)
                  walk(j)
          PYEOF
          echo "===== menu.d dir diff ====="
          diff -rq rfs-old/usr/share/luci/menu.d rfs-new/usr/share/luci/menu.d || true
          echo "===== NEW uhttpd -h full config read check ====="
          sudo chroot rfs-new /sbin/uci show uhttpd 2>&1 | head -20 || true
