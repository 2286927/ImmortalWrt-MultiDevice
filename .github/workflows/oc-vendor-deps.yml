name: oc-vendor-deps
on:
  push:
    paths:
      - '.github/workflows/oc-vendor-deps.yml'
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned binaries
        run: |
          set -e
          mkdir -p tools/onecloud
          curl -fsSL -o tools/onecloud/AmlImg "https://github.com/rmoyulong/AmlImg/releases/download/v0.3.2/AmlImg_v0.3.2_linux_amd64"
          curl -fsSL -o tools/onecloud/uboot.img "https://github.com/rmoyulong/u-boot-onecloud/releases/download/Onecloud_Uboot_23.12.24_18.15.09/eMMC.burn.img"
          chmod +x tools/onecloud/AmlImg
          echo "f91106e9f20d56e4eb83d8be4a7b063e46cbb4c6a151884a4bb74f33c0b2c6e7  tools/onecloud/AmlImg" | sha256sum -c -
          echo "b4d6fb1abd5b0f1916bf0bab4c1dce933f24c620d2a2d672d4d4f0e95ab02eb4  tools/onecloud/uboot.img" | sha256sum -c -
          ls -l tools/onecloud
      - name: Commit and push
        run: |
          set -e
          git config user.name "oc-bot"
          git config user.email "oc-bot@users.noreply.github.com"
          git add tools/onecloud/AmlImg tools/onecloud/uboot.img
          git commit -m "chore(tools): 固化 AmlImg v0.3.2 与 uboot Onecloud_Uboot_23.12.24_18.15.09（离线自足）"
          git push
