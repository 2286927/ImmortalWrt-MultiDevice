name: tmp-oc-dt-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: 抽取线刷包 DTB 解析分区表（btrfs p3 未落地定案）
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq device-tree-compiler xz-utils
          TAG="OneCloud_openwrt-25.12_26.10.27_19.30.58"
          echo "=== 目标 Release: $TAG ==="
          gh release view "$TAG" --repo $GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          gh release download "$TAG" --repo $GITHUB_REPOSITORY --pattern '*burn.img.xz' --clobber
          BURN=$(ls *burn.img.xz 2>/dev/null | head -1)
          if [ -n "$BURN" ]; then xz -dk "$BURN"; IMG="${BURN%.xz}"; else IMG=$(ls *burn.img 2>/dev/null | grep -v '\.xz$' | head -1); fi
          echo "=== IMG=$IMG ($(stat -c%s $IMG) bytes) ==="
          python3 - "$IMG" << 'EOF'
          import sys, struct
          data = open(sys.argv[1],'rb').read()
          off, n = 0, 0
          while True:
              off = data.find(b'\xd0\x0d\xfe\xed', off)
              if off < 0: break
              ts = struct.unpack('>I', data[off+4:off+8])[0]
              if 0x1000 < ts < 0x400000:
                  open(f'/tmp/dtb_{off:08x}.dtb','wb').write(data[off:off+ts])
                  print(f'DTB found at {off:#x} size {ts}')
                  n += 1
              off += 4
          print(f'total DTB: {n}')
          EOF
          echo "=== 分区表解析 ==="
          for f in /tmp/dtb_*.dtb; do
            echo "--- $f ---"
            dtc -I dtb -O dts "$f" 2>/dev/null | grep -B4 -A80 'partitions' | head -140
          done
          echo "=== uboot strings 分区名兜底 ==="
          strings "$IMG" | grep -E '^(bootloader|boot|rootfs|data)$' | head -20
