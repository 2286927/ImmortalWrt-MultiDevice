name: oc-brand-wire
on:
  push:
    paths:
      - .github/workflows/oc-brand-wire.yml
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: wire brand unify and luci hint
        run: |
          set -euo pipefail
          W=.github/workflows/ImmortalWrt-25.12-onecloud.yml
          printf '%s\n' '          bash $GITHUB_WORKSPACE/scripts/onecloud/brand-unify.sh $GITHUB_WORKSPACE/recipe' > /tmp/ins.txt
          awk 'NR==FNR{ins=$0; next} {print} /git log -1/{print ins}' /tmp/ins.txt "$W" > /tmp/w.yml
          mv /tmp/w.yml "$W"
          test "$(grep -c 'brand-unify.sh' "$W")" = "1"
          J=scripts/onecloud/10_system.js
          sed -i 's|终端预检: sh /tmp/oc-upgrade.sh --check；有新固件时执行: sh /tmp/oc-upgrade.sh --reboot|检测: upgrade --check　升级: upgrade --reboot|' "$J"
          test "$(grep -c '检测: upgrade --check' "$J")" = "1"
          python3 -c "import yaml; yaml.safe_load(open('$W')); print('yml parse ok')" || { pip3 install -q pyyaml; python3 -c "import yaml; yaml.safe_load(open('$W')); print('yml parse ok')"; }
          git config user.name "ai-zhouchang-bot"
          git config user.email "bot@users.noreply.github.com"
          git rm -f .github/workflows/oc-brand-wire.yml
          git add -A
          git commit -m "feat(onecloud): 构建期接入品牌统一；概览页升级通道提示精简"
          git push origin HEAD:main
