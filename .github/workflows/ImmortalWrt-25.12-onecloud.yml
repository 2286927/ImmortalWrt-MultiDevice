#========================================================================================================================
# 玩客云（OneCloud / Amlogic S805 meson8b cortex-a5 32位）直刷固件
# 方案来源：旧仓库 2286927/OneCloud_immortalwrt 成功配方（commit 6cb5de77，2026-04-17 / 05-04 两次编译成功）
#   1. immortalwrt 官方源码无 amlogic target，构建时从 coolsnowwolf/lede clone 平台树，6.6 补丁/配置改名 6.12
#   2. 配置使用配方仓库 Config/quicker-amlogic.config（32 位 meson8b 专用）
#   3. convert3.sh 制作 AmlImg 直刷包（含 uboot，双USB公头线刷）
# 上游适配修复（原 16 连败根因）：vernesong/OpenClash core 分支改版——premium/ 目录删除、classic dev 内核停发，
#   openclash32.sh 修复版统一安装 meta(mihomo) armv7 内核（scripts/onecloud/openclash32-fixed.sh）
# r40（10-28 裁决）：①lighttpd 剔除（r38 config 实锤出厂携带、luci-app 零依赖方，
#   开机抢 IPv4:80 致 192.168.1.2 403；依赖链若拉回则 fail 人工裁决改 8080）②governor 全量补 conservative
# r41 修复（10-28 实机巡检）：①conservative governor 构建丢失——config-6.6 迁移件含显式
#   not set 行与追加 =y 重复并存被内核 merge 裁剪（r40 实机 /proc/config.gz not set，仅 5 档），
#   改 sed 原位改写；②出厂 shadow root 空 hash——Release 口径"默认密码 password"实为空密码，
#   LuCI 空hash特例放行、dropbear crypt 严格比对拒非空（SSH 密码全拒），注入 99-root-password 首启置真 hash
# r38 方案B（10-28 裁决）：弃 p3 btrfs（Amlogic rootfs size=-1 到盘尾，p3 建表项内被 GPT overlap 拒）
#   改 rootfs 首启在线扩容吃满分区剩余（scripts/onecloud/firstboot-rootfs-grow.sh → 99-rootfs-grow）
#   docker 留 /opt + 品牌定制（DISTRIB_DESCRIPTION/LuCI 概览四行）
#========================================================================================================================
name: ImmortalWrt-25.12-ONECLOUD

on:
  repository_dispatch:
    types: [build_firmware]
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
      force_build:
        description: '强制构建（false=仅在源码/配方/配置有变化时构建）'
        required: false
        default: 'true'
  schedule:
    - cron: "30 19 * * 5"

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  # r52: 配方已固化入库（recipe-vendor.tar.gz），构建不再 clone 外部仓库。
  #      以下两项仅作溯源记录，如需追溯来源请查 recipe/.source-commit
  RECIPE_REPO: https://github.com/2286927/OneCloud_immortalwrt
  RECIPE_REF: 390f150fc256e38a4b21311cb1cbb9f3d367c590
  OWRT_IP: 172.16.8.1
  OWRT_NAME: OneCloud
  OWRT_CFG: recipe/Config/quicker-amlogic.config
  OWRT_FILES: recipe/onecloud/files
  TZ: Asia/Shanghai

permissions:
  contents: write
  actions: write

jobs:
  check-updates:
    name: 检测源码/配方是否更新
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
    steps:
      - name: 计算三源指纹
        id: fp
        run: |
          set -eu
          UP_SHA=$(git ls-remote "${{ env.REPO_URL }}" "refs/heads/${{ env.REPO_BRANCH }}" | cut -f1)
          LEDE_SHA=$(git ls-remote https://github.com/coolsnowwolf/lede refs/heads/master | cut -f1)
          SELF_SHA="${{ github.sha }}"
          [ -n "$UP_SHA" ] && [ -n "$LEDE_SHA" ] || { echo "::error::上游 HEAD 解析失败"; exit 1; }
          FP=$(printf '%s\n%s\n%s\n' "$UP_SHA" "$LEDE_SHA" "$SELF_SHA" | sha256sum | cut -c1-32)
          echo "上游=$UP_SHA  lede=$LEDE_SHA  本仓=$SELF_SHA"
          echo "fingerprint=$FP" >> $GITHUB_OUTPUT

      - name: 指纹比对（缓存 key 即指纹，命中=无更新）
        id: fpc
        uses: actions/cache/restore@v5
        with:
          path: .fp
          key: fp-${{ env.REPO_BRANCH }}-${{ steps.fp.outputs.fingerprint }}

      - name: 判定是否构建
        id: decide
        run: |
          E='${{ github.event_name }}'; F='${{ inputs.force_build }}'; H='${{ steps.fpc.outputs.cache-hit }}'
          GO=true
          if [ "$H" = "true" ] && { [ "$E" = "schedule" ] || { [ "$E" = "workflow_dispatch" ] && [ "$F" = "false" ]; }; }; then GO=false; fi
          echo "should_build=$GO" >> $GITHUB_OUTPUT
          echo ">>> should_build=$GO（事件=$E 指纹命中=$H force=$F）"

  build-onecloud:
    name: 玩客云 amlogic 直刷固件
    needs: check-updates
    if: always() && needs.check-updates.outputs.should_build != 'false'
    runs-on: ubuntu-24.04
    steps:
      - name: 清理服务器空间(Ubuntu)
        uses: rmoyulong/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523  # main @ 2026-09-17
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout 主仓库
        uses: actions/checkout@v7.0.1

      - name: 存储额度治理（artifacts 预清理）
        # r57（对齐 UP r57）：artifact 存储配额是账号级、不分仓，本仓只能清本仓条目。
        #   跑在编译最前面，让本轮上传（含失败路径的「上传编译日志」）有足额余量。
        #   规则：同族只留最新 2 条，且超 3 天的一律删；当前 run 自己的产物不动。
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - "${{ github.repository }}" "${{ github.run_id }}" <<'PY'
          import datetime, json, re, subprocess, sys

          repo, cur = sys.argv[1], sys.argv[2]
          KEEP, AGE = 2, 3


          def api(p, m='GET'):
              r = subprocess.run(['gh', 'api', '-X', m, p], capture_output=True, text=True)
              return r.returncode, r.stdout, r.stderr


          def listing():
              rc, out, err = api('/repos/%s/actions/artifacts?per_page=100' % repo)
              if rc != 0:
                  print('::warning::读取 artifact 列表失败 rc=%d %s' % (rc, err[:150]))
                  return None
              return json.loads(out or '{}').get('artifacts', [])


          items = listing()
          if items is None:
              raise SystemExit(0)
          total = lambda xs: sum(x['size_in_bytes'] for x in xs) / 1073741824
          print('=== 治理前：%d 条，合计 %.2f GB ===' % (len(items), total(items)))


          def grp(n):
              # 同族归并：剥掉尾部日期戳（26.11.06_15.39.35 / 202611060132 / 202609171425）
              n = re.sub(r'[-_]\d{2}\.\d{2}\.\d{2}[_\d.]*$', '', n)
              return re.sub(r'[-_]\d{8,}$', '', n)


          now = datetime.datetime.now(datetime.timezone.utc)
          seen = {}
          for x in sorted(items, key=lambda y: y['created_at'], reverse=True):
              if str((x.get('workflow_run') or {}).get('id')) == cur:
                  continue
              age = (now - datetime.datetime.fromisoformat(x['created_at'].replace('Z', '+00:00'))).days
              k = grp(x['name'])
              seen[k] = seen.get(k, 0) + 1
              if age > AGE or seen[k] > KEEP:
                  rc, out, err = api('/repos/%s/actions/artifacts/%s' % (repo, x['id']), 'DELETE')
                  print('  删 %-44s %7.1f MB  rc=%d %s' % (
                      x['name'][:44], x['size_in_bytes'] / 1048576, rc, (err or '').strip()[:60]))


          items = listing()
          if items is not None:
              print('=== 治理后：%d 条，合计 %.2f GB ===' % (len(items), total(items)))
          PY

      - name: 初始化编译环境
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # r52（对齐 UP r48）：抑制 needrestart。
          #   apt 结束后它会主动重启服务，子进程占住 stdout 管道不放，表现在 GitHub 侧是：
          #   脚本已执行完（末行 df -Th 正常输出）、日志不再前进、步骤永远 in_progress、
          #   最终 job 收尾空转被判失败且日志 blob 不归档。
          #   实证：2026-11-07 run 42337618785 第 4 步卡住 8 分钟+；2026-11-06 UP run #7 同因失联。
          export NEEDRESTART_SUSPEND=1
          # 双保险：NEEDRESTART_SUSPEND 经 sudo -E 可能被 sudoers 的 env_reset 过滤，
          #   直接写配置，restart="l" = 只列出待重启服务、绝不自动重启。
          sudo mkdir -p /etc/needrestart/conf.d
          echo '$nrconf{restart} = "l";' | sudo tee /etc/needrestart/conf.d/99-ci-no-restart.conf >/dev/null
          echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
          sudo -E apt-get -qq update --fix-missing
          # r52（对齐 UP r47b）：去掉 full-upgrade。
          #   CI 每次升级整个 Ubuntu 既慢又没必要——编译只依赖工具链与构建工具，
          #   83 包的依赖清单已覆盖；实测同步骤耗时在 2m46s ~ 65min 之间漂移，全看当次待升级包数量。
          # sudo -E apt-get -qq -y full-upgrade
          # r50：依赖清单改为读仓库内文件，不再联网拉取外部 URL。
          # 外部清单一挂或内容被改，构建就直接红；本地文件改动会留 git 记录。
          DEPFILE="$GITHUB_WORKSPACE/config/Ubuntu-2410.txt"
          test -f "$DEPFILE" || { echo "::error::依赖清单缺失：$DEPFILE"; exit 1; }
          PKGS=$(grep -vE '^\s*#|^\s*$' "$DEPFILE" | tr '\n' ' ')
          test -n "$PKGS" || { echo "::error::依赖清单为空：$DEPFILE"; exit 1; }
          echo "依赖包数量: $(echo $PKGS | wc -w)"
          # r52（对齐 UP r49）：给依赖安装设硬上限，超时不再拖死整个构建；
          #   runner 到 apt 源带宽实测约 150KB/s，装不完时宁可带着已有工具继续编译。
          set +e
          sudo timeout 900 env NEEDRESTART_SUSPEND=1 apt-get -qq -y --no-upgrade --no-install-recommends \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
            -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold \
            install $PKGS
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::warning::依赖安装未在 15 分钟内完成（rc=$RC），恢复 dpkg 状态后继续构建"
            sudo dpkg --configure -a || true
          else
            echo "依赖安装完成"
          fi
          sudo -E apt-get -qq -y --no-upgrade --no-install-recommends install android-sdk-libsparse-utils dos2unix xz-utils || true
          # r52（对齐 UP r48）：移除 autoremove --purge。
          #   一次性容器无清理收益；镜像变动后它会批量删包并触发 needrestart，
          #   是 runner 失联的高风险源。
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          df -Th

      - name: 初始化变量
        run: |
          export OWRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV
          echo "OWRT_SERVER_IP=${OWRT_IP%.*}.1" >> $GITHUB_ENV

      - name: 克隆源仓库
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 展开内置配方（自给自足，不再依赖外部仓库）
        run: |
          # r52: 配方已固化入库为 recipe-vendor.tar.gz（184 文件 / 6.36MB 源码）。
          #   未纳入 vendor 的部分及原因：
          #     · lede/ lede6.6/ lede6.12/  —— 平台树构建时从 coolsnowwolf/lede clone；
          #       boot 分区由 scripts/onecloud/convert3.sh 从本次编译产物 p1 提取
          #     · AmlImg / uboot.img        —— r42 已固化于 tools/onecloud/
          #     · openclash core/GeoIP/GeoSite/Country.mmdb、v2ray geodata
          #       —— sh/openclash32.sh 与 scripts/onecloud/openclash32-fixed.sh 构建时重新下载
          cd "$GITHUB_WORKSPACE"
          test -f recipe-vendor.tar.gz || { echo "::error::缺少 recipe-vendor.tar.gz"; exit 1; }
          sha256sum -c recipe-vendor.sha256 || { echo "::error::recipe-vendor 校验失败"; exit 1; }
          rm -rf recipe
          tar -xzf recipe-vendor.tar.gz
          test -f recipe/Config/quicker-amlogic.config || { echo "::error::recipe 展开不完整：缺 quicker-amlogic.config"; exit 1; }
          test -f recipe/sh/setup.sh || { echo "::error::recipe 展开不完整：缺 sh/setup.sh"; exit 1; }
          test -d recipe/onecloud/files/etc || { echo "::error::recipe 展开不完整：缺 onecloud/files/etc"; exit 1; }
          cd recipe
          # r56: vendor 包内的 Config/quicker-amlogic.config 是 CRLF（实测 1652/1652 行）。
          #   后果：加载自定义配置里 defconfig 之前的所有
          #     `grep -qx 'CONFIG_X=y' .config` 与 `sed -E '/^...=y$/d' .config`
          #   全部静默失效（行尾多一个 \r）。实测 run 42487148698：r51 的
          #   「>>> socat OpenSSL 预置」一次都没打印，即该预置一直是空操作，
          #   真正生效的是 defconfig 之后的自愈守卫。归一行尾后预置按设计生效。
          sed -i 's/\r$//' Config/*.config
          if grep -q $'\r' Config/*.config; then
            echo "::error::配方 config 仍含 CRLF，行尾归一失败"
            exit 1
          fi
          echo "配置行尾已归一: $(grep -c '^CONFIG_' Config/quicker-amlogic.config) 个 CONFIG 行"
          # 配方脚本内部的 $GITHUB_WORKSPACE/xxx 引用统一指向 recipe 子目录
          sed -E -i 's#\$GITHUB_WORKSPACE/(sh|lede6|onecloud|ax6|Config|Ubuntu)#\$GITHUB_WORKSPACE/recipe/\1#g' sh/*.sh
          dos2unix sh/*.sh 2>/dev/null || true
          chmod +x sh/*.sh
          echo "配方来源: 内置 vendor，上游 commit $(cat .source-commit 2>/dev/null || echo unknown)"

      - name: 注入 amlogic target 树并适配 6.12 内核(核心修复)
        working-directory: /workdir/openwrt
        run: |
          # 25.12 分支 generic 仅有 6.12 内核 → 采用 Kwrt(openwrt.ai) 验证方案：
          # flippy amlogic 树(coolsnowwolf/lede master, 6.6 为 testing 持续维护) 6.6 补丁/配置改名 6.12
          git clone --depth 1 https://github.com/coolsnowwolf/lede /tmp/lede-tree
          rm -rf target/linux/amlogic
          mv /tmp/lede-tree/target/linux/amlogic target/linux/amlogic
          rm -rf /tmp/lede-tree
          sed -i -e "s/KERNEL_PATCHVER:=6.18/KERNEL_PATCHVER:=6.12/" \
                 -e "/KERNEL_TESTING_PATCHVER/d" \
                 -e "/autocore-arm/d" \
                 -e "s/ pci pcie//" \
                 target/linux/amlogic/Makefile
          mv -f target/linux/amlogic/patches-6.6 target/linux/amlogic/patches-6.12
          mv -f target/linux/amlogic/config-6.6 target/linux/amlogic/config-6.12
          mv -f target/linux/amlogic/meson8b/config-6.6 target/linux/amlogic/meson8b/config-6.12
          # r8修复1: 6.6→6.12 跨版本 kconfig 新符号预置（r8 实证 MDIO_BUS_MUX_MESON_GXL (NEW) 提示）
          grep -q "^CONFIG_MDIO_BUS_MUX_MESON_GXL=" target/linux/amlogic/meson8b/config-6.12 || echo "CONFIG_MDIO_BUS_MUX_MESON_GXL=m" >> target/linux/amlogic/meson8b/config-6.12
          # r40: cpufreq governors 全量（r39 四个基础上补 conservative，用户裁决"全加"）；默认档保持 performance 不动
          grep -q "^CONFIG_CPU_FREQ_GOV_SCHEDUTIL=" target/linux/amlogic/meson8b/config-6.12 || echo "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y" >> target/linux/amlogic/meson8b/config-6.12
          grep -q "^CONFIG_CPU_FREQ_GOV_ONDEMAND=" target/linux/amlogic/meson8b/config-6.12 || echo "CONFIG_CPU_FREQ_GOV_ONDEMAND=y" >> target/linux/amlogic/meson8b/config-6.12
          grep -q "^CONFIG_CPU_FREQ_GOV_POWERSAVE=" target/linux/amlogic/meson8b/config-6.12 || echo "CONFIG_CPU_FREQ_GOV_POWERSAVE=y" >> target/linux/amlogic/meson8b/config-6.12
          grep -q "^CONFIG_CPU_FREQ_GOV_USERSPACE=" target/linux/amlogic/meson8b/config-6.12 || echo "CONFIG_CPU_FREQ_GOV_USERSPACE=y" >> target/linux/amlogic/meson8b/config-6.12
          # r41: conservative 单独用 sed 原位改写——迁移件 config-6.6 含显式 "# CONFIG_CPU_FREQ_GOV_CONSERVATIVE
          # is not set"，与下方追加 =y 重复并存时内核 merge 裁剪该符号（r40 实机 not set 实锤）；其余四 governor
          # 在迁移件中无本体行或本就 =y，grep 追加方式已实证生效，保持不动
          sed -i 's|^# CONFIG_CPU_FREQ_GOV_CONSERVATIVE is not set$|CONFIG_CPU_FREQ_GOV_CONSERVATIVE=y|' target/linux/amlogic/meson8b/config-6.12
          grep -q "^CONFIG_CPU_FREQ_GOV_CONSERVATIVE=y" target/linux/amlogic/meson8b/config-6.12 || echo "CONFIG_CPU_FREQ_GOV_CONSERVATIVE=y" >> target/linux/amlogic/meson8b/config-6.12
          grep -qE "^CONFIG_CPU_FREQ_GOV_(SCHEDUTIL|ONDEMAND|POWERSAVE|USERSPACE|CONSERVATIVE)=y" target/linux/amlogic/meson8b/config-6.12 || { echo "::error::governor 五项未齐"; exit 1; }
          # r8修复2: 移除 kconfig 未设符号中止开关（include/kernel-build.mk），其余 6.12 新符号按默认值静默取值，防 syncconfig 交互 EOF
          sed -i '/export FAIL_ON_UNCONFIGURED=1/d' include/kernel-build.mk
          # Kwrt 验证过的两个 6.12 冲突补丁
          rm -f target/linux/amlogic/patches-6.12/001-dts-s905d-fix-high-load.patch
          rm -f target/linux/amlogic/patches-6.12/902-use-system-LED-for-OpenWrt.patch
          chmod -Rf 755 target/linux/amlogic
          echo "=== amlogic target 树 ==="
          ls target/linux/amlogic
          echo "=== 树适配校验 ==="
          grep "KERNEL_PATCHVER" target/linux/amlogic/Makefile
          test -d target/linux/amlogic/patches-6.12 || { echo "::error::patches-6.12 缺失"; exit 1; }
          test -f target/linux/amlogic/meson8b/target.mk || { echo "::error::meson8b 缺失"; exit 1; }
          echo "=== 树内核版本 ==="
          grep -E "KERNEL_PATCHVER" target/linux/amlogic/Makefile

      - name: 设置订阅源
        working-directory: /workdir/openwrt
        run: |
          bash $GITHUB_WORKSPACE/recipe/sh/setup.sh
          echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: 启动缓存[第二次起生效]
        uses: rmoyulong/cachewrtbuild@b729f807837dbc3455d02fd35192660d9b662121  # main @ 2026-05-10
        with:
          ccache: 'true'
          prefix: ${{ github.workspace }}/openwrt
          mixkey: amlogic6.6/tree/${{ env.REPO_BRANCH }}?device=quicker-amlogic-2512

      - name: 计算 dl 缓存键
        run: |
          # r56: 本仓 19 条线（21.02/23.05/24.10/25.12 各设备）统一用 dl-<分支>-<年月>，
          #   同分支各设备共用一份源码包池；onecloud 此前没有 dl 缓存，
          #   实测 run 42487148698 的 make download -j8 耗时 3m58s，全部是重复下载。
          echo "DL_CACHE_KEY=dl-${REPO_BRANCH}-$(date +%Y%m)" >> $GITHUB_ENV
          echo "dl 缓存键: dl-${REPO_BRANCH}-$(date +%Y%m)"
          if [ -d /workdir/openwrt/dl ]; then
            echo "恢复前 dl: $(find /workdir/openwrt/dl -type f | wc -l) 个文件 / $(du -sh /workdir/openwrt/dl | cut -f1)"
          else
            echo "恢复前 dl: 目录尚不存在（首跑正常）"
          fi

      - name: 恢复 dl 源码包缓存
        id: cache-dl
        uses: actions/cache@v5
        with:
          # 绝对路径：openwrt 是符号链接，用 workspace 相对路径会让 actions/cache 解析歧义
          path: /workdir/openwrt/dl
          key: ${{ env.DL_CACHE_KEY }}
          restore-keys: |
            dl-${{ env.REPO_BRANCH }}-

      - name: 安装订阅源
        working-directory: /workdir/openwrt
        timeout-minutes: 30
        run: |
          # r54: 关掉 git 自动 gc/维护 —— gc 后台进程会继承 stdout 管道，
          #   导致脚本已跑完而 GitHub 认为步骤未结束（run 42347873605 实证：日志已到末行 df，步骤仍 in_progress）。
          git config --global gc.auto 0 || true
          git config --global maintenance.auto false || true
          export GIT_TERMINAL_PROMPT=0
          FEEDS_LOG=/tmp/feeds.log
          : > $FEEDS_LOG
          set +e
          (
            set -e
            echo "=== feeds 前磁盘 ==="; df -h . | tail -1
            # r53: feeds 是外网 git 操作，无超时会静默悬挂。
            #   实证 2026-11-07 run 42338915465：feeds update 卡 51 分钟后 job 失败、日志未归档。
            #   加硬超时，把悬挂变成可诊断的快速失败。
            timeout 1200 ./scripts/feeds update -a || { echo "::error::feeds update 超时或失败（限 1200s）"; df -h .; exit 1; }
            bash $GITHUB_WORKSPACE/recipe/sh/RollbacktoDockerVersion.sh
            # r8修复3: 25.12 feed dockerd 引用为 docker-v$(PKG_VERSION)，回滚 25.0.6 需还原 v 前缀（否则 codeload 404，哈希已实测匹配）
            sed -i 's/PKG_GIT_REF:=docker-v/PKG_GIT_REF:=v/' feeds/packages/utils/dockerd/Makefile
            timeout 900 ./scripts/feeds install -a || { echo "::error::feeds install 超时或失败（限 900s）"; exit 1; }
            echo "=== feeds 后磁盘 ==="; df -h . | tail -1
          ) >> $FEEDS_LOG 2>&1
          RC=$?
          set -e
          cat $FEEDS_LOG
          exit $RC

      - name: 加载自定义配置
        working-directory: /workdir/openwrt
        run: |
          cp $GITHUB_WORKSPACE/recipe/ax6/banner package/base-files/files/etc/banner
          bash $GITHUB_WORKSPACE/recipe/sh/lean2.sh
          bash $GITHUB_WORKSPACE/recipe/sh/new_remove.sh
          sed -i '/ssh-pkdsrv_auth/d' package/network/services/dropbear/files/dropbear.init 2>/dev/null || true
          grep -q -- '-B' package/network/services/dropbear/files/dropbear.init || sed -i 's|procd_set_param command "$PROG" -F -P "$pid_file"|procd_set_param command "$PROG" -F -B -P "$pid_file"|' package/network/services/dropbear/files/dropbear.init
          grep -q -- '-B' package/network/services/dropbear/files/dropbear.init || { echo "::error::dropbear -B 注入失败"; exit 1; }
          dos2unix $GITHUB_WORKSPACE/recipe/onecloud/files/etc/*.sh
          dos2unix $GITHUB_WORKSPACE/recipe/onecloud/files/etc/rc.*
          chmod -Rf 755 $GITHUB_WORKSPACE/recipe/onecloud/files/etc/*.sh
          chmod -Rf 755 $GITHUB_WORKSPACE/recipe/onecloud/files/etc/rc.*
          chmod -Rf 755 $GITHUB_WORKSPACE/recipe/onecloud/files/etc/init.d/*
          chmod -R 777 $GITHUB_WORKSPACE/recipe/onecloud/files/etc/aria2
          chmod -R 777 $GITHUB_WORKSPACE/recipe/onecloud/files/mnt/sda1/aria2
          chmod -R 777 $GITHUB_WORKSPACE/recipe/onecloud/files/mnt/sda1/aria2/download
          chmod -R 755 $GITHUB_WORKSPACE/recipe/onecloud/files/mnt/sda1/share

          rm -rf ./tmp* ./.config*
          cp $GITHUB_WORKSPACE/${{ env.OWRT_CFG }} .config
          # r51: socat OpenSSL 显式预置（本线走 lean2.sh 配方，不经过 scripts/*/diy-part2.sh 的 1h 门禁；
          #   quicker-amlogic.config 只选 luci-app-socat，socat 由其依赖拉入，CONFIG_SOCAT_SSL 无默认值 → 恒 not set；
          #   packages feed net/socat/Makefile 在 SOCAT_SSL!=y 时传 --disable-openssl，编出的 socat 无 TLS 能力）
          #   放在 defconfig 之前，让 kconfig 从一开始就继承 y，避免事后补写被重算覆盖
          if grep -qx 'CONFIG_PACKAGE_luci-app-socat=y' .config || grep -qx 'CONFIG_PACKAGE_socat=y' .config; then
            grep -qx 'CONFIG_PACKAGE_socat=y' .config || echo 'CONFIG_PACKAGE_socat=y' >> .config
            sed -i '/^# CONFIG_SOCAT_SSL is not set$/d' .config
            grep -qx 'CONFIG_SOCAT_SSL=y' .config || echo 'CONFIG_SOCAT_SSL=y' >> .config
            sed -i '/^# CONFIG_PACKAGE_libopenssl is not set$/d' .config
            grep -qx 'CONFIG_PACKAGE_libopenssl=y' .config || echo 'CONFIG_PACKAGE_libopenssl=y' >> .config
            echo ">>> socat OpenSSL 预置: $(grep -E '^CONFIG_(PACKAGE_socat|SOCAT_SSL|PACKAGE_libopenssl)=' .config | tr '\n' ' ')"
          fi
          # r10修复(用户决策弃用 fw3+legacy): 25.12 APK 体系中 iptables-mod-* 全系硬依赖 iptables-zz-legacy，
          # 与 iptables-nft 互斥；且 legacy 后端在新分支软件生态兼容性差。统一弃用 legacy 后端：
          # 1) 删除全部 iptables/ip6tables 的 mod-* 与 zz-legacy 条目 2) iptables-nft 作为唯一后端
          # 3) 补 nft 原生内核模块 kmod-nft-tproxy/kmod-nft-socket（替代 xt_ 生态；fullcone 配方已有 kmod-nft-fullcone）
          sed -i -E '/^CONFIG_PACKAGE_(iptables|ip6tables)-(mod-[a-z0-9-]+|zz-legacy)=y$/d' .config
          # fw4 完全体: miniupnpd 反转为 nftables 变体（与其他 14 线一致），fw4 防火墙断言
          sed -i -e 's/^CONFIG_PACKAGE_miniupnpd-iptables=y$/# CONFIG_PACKAGE_miniupnpd-iptables is not set/' \
                 -e 's/^CONFIG_PACKAGE_miniupnpd-nftables=n$/CONFIG_PACKAGE_miniupnpd-nftables=y/' .config
          grep -q '^CONFIG_PACKAGE_firewall4=y' .config || echo 'CONFIG_PACKAGE_firewall4=y' >> .config
          grep -q '^CONFIG_PACKAGE_miniupnpd-nftables=y' .config || echo 'CONFIG_PACKAGE_miniupnpd-nftables=y' >> .config
          # 清 fw3 时代 xt_ 死重内核模块（用户态工具已禁用；运行时保留 core/conntrack/nat/nat6/ipset/offload）
          sed -i -E '/^CONFIG_PACKAGE_kmod-ipt-(conntrack-extra|extra|iprange|ipsec|physdev|socket|tproxy)=y$/d' .config
          grep -q '^CONFIG_PACKAGE_iptables-nft=y' .config || echo 'CONFIG_PACKAGE_iptables-nft=y' >> .config
          grep -q '^CONFIG_PACKAGE_kmod-nft-tproxy=y' .config || echo 'CONFIG_PACKAGE_kmod-nft-tproxy=y' >> .config
          grep -q '^CONFIG_PACKAGE_kmod-nft-socket=y' .config || echo 'CONFIG_PACKAGE_kmod-nft-socket=y' >> .config
          echo "=== meson8b 配置关键项 ==="
          grep -E "^CONFIG_TARGET_(amlogic|BOARD|SUBTARGET|PROFILE|DEVICE)" .config | head -8 || true

          # r36 重加 r28（r31 重写 yml 时丢失）: 配方自带旧版 luci-app-aria2（lua cbi）在 25.12（APK 包管理）下崩溃——
          # ipkg_ver() 读 /usr/lib/opkg/info/*.control，目录不存在返回 nil → cbi 渲染崩
          # （aria2.lua:151 attempt to concatenate a nil value；L199 ipkg_ver_lined 同病）；
          # controller 依赖的 luci.model.ipkg 模块在 25.12 已移除 → 状态页 require 同样会崩。
          # 三处防护注入（cbi 两处 + controller require pcall 兜底）：版本显示 unknown、yaaw/webui 状态恒未安装。
          sed -i 's|o.placeholder = "aria2/" .. ipkg_ver("aria2")|o.placeholder = "aria2/" .. (ipkg_ver("aria2") or "unknown")|' $GITHUB_WORKSPACE/recipe/onecloud/files/usr/lib/lua/luci/model/cbi/aria2.lua
          sed -i 's|return ipkg_ver(pkg):gsub("%.", "-")|return (ipkg_ver(pkg) or ""):gsub("%.", "-")|' $GITHUB_WORKSPACE/recipe/onecloud/files/usr/lib/lua/luci/model/cbi/aria2.lua
          sed -i 's|local ipkg = require "luci.model.ipkg"|local ipkg = (function() local ok, m = pcall(require, "luci.model.ipkg"); if ok then return m end; return setmetatable({}, {__index = function() return function() return false end end}) end)()|' $GITHUB_WORKSPACE/recipe/onecloud/files/usr/lib/lua/luci/controller/aria2.lua
          grep -q 'ipkg_ver("aria2") or "unknown"' $GITHUB_WORKSPACE/recipe/onecloud/files/usr/lib/lua/luci/model/cbi/aria2.lua || { echo "::error::aria2 cbi L151 防护注入失败"; exit 1; }
          grep -q '(ipkg_ver(pkg) or ""):gsub' $GITHUB_WORKSPACE/recipe/onecloud/files/usr/lib/lua/luci/model/cbi/aria2.lua || { echo "::error::aria2 cbi L42 防护注入失败"; exit 1; }
          grep -q 'pcall(require, "luci.model.ipkg")' $GITHUB_WORKSPACE/recipe/onecloud/files/usr/lib/lua/luci/controller/aria2.lua || { echo "::error::aria2 controller 兜底注入失败"; exit 1; }
          # r36 重加 r29（r31 重写 yml 时丢失）: ①aria2c 在 procd jail 沙箱内 dlopen OpenSSL legacy provider 失败
          # （OSSL_PROVIDER_load 'legacy' failed → crash loop）——移除 jail 三行，下载器场景沙箱收益低；
          # ②25.12 下 S99dockerd 开机未执行（/tmp/dockerd 不生成 + logread 零痕迹，重启复现实锤）——
          # diymo.sh 尾部加延迟 30s 显式拉起兜底（procd 幂等，rcS 恢复后也不会双重启动）。
          sed -i '/^[[:space:]]*procd_add_jail /d; /^[[:space:]]*procd_add_jail_mount/d' $GITHUB_WORKSPACE/recipe/onecloud/files/etc/init.d/aria2
          sed -i '/^\/etc\/init.d\/aria2 restart$/a\# r29: 25.12 S99dockerd 不执行兜底（延迟 30s 显式拉起，procd 幂等）\n(sleep 30; /etc/init.d/dockerd enabled \&\& { /etc/init.d/dockerd running || /etc/init.d/dockerd start; }) \&' $GITHUB_WORKSPACE/recipe/onecloud/files/etc/diymo.sh
          ! grep -q 'procd_add_jail' $GITHUB_WORKSPACE/recipe/onecloud/files/etc/init.d/aria2 || { echo "::error::aria2 jail 移除失败"; exit 1; }
          grep -q 'sleep 30' $GITHUB_WORKSPACE/recipe/onecloud/files/etc/diymo.sh || { echo "::error::dockerd 延迟启动注入失败"; exit 1; }

          if [ ! -d "./files" ]; then mkdir ./files; fi
          cp -rf $GITHUB_WORKSPACE/${{ env.OWRT_FILES }}/* ./files
          # 去掉多余的dhcp文件，让首次启动有dhcp服务
          rm -rf ./files/etc/config/dhcp

          # r38 方案B: 首启 rootfs 在线扩容（resize2fs 吃满分区，替代 r31 p3 btrfs 弃案）
          mkdir -p files/etc/uci-defaults
          cp -f $GITHUB_WORKSPACE/scripts/onecloud/firstboot-rootfs-grow.sh files/etc/uci-defaults/99-rootfs-grow
          chmod 755 files/etc/uci-defaults/99-rootfs-grow
          # r51: 日志卫生自愈（2026-11-06 实机巡检裁决）
          #   出厂固件在无任何用户操作时即持续产生 err/crit，根因在出厂模板与包组合：
          #     A9 crond 以 debug 级(5)运行 → 每分钟 4~5 行 cron.err，淹没真实错误
          #     B5 system.log_proto='udp' 但无 log_ip → 孤儿远程 syslog 残留
          #     A1 dnsmasq 绑定 docker0，restart 时争抢 172.17.0.1:<port> → daemon.crit（唯一 Critical）
          #     A4 fstab 残留指向已不存在 UUID 的 mount 条目
          #     A2 avahi-dbus-daemon 已装但 /etc/passwd 无 avahi 用户 → 服务反复崩溃(实测 7 次)
          #     B2 nfs-kernel-server 启用但 exports 为空 → NFSD -110 + exportfs 报错，纯空转
          #   脚本幂等/容错/仅在变更时写 flash，每次开机自愈——兜住上游 recipe(OneCloud_immortalwrt)
          #   未同步修正的情况，确保新出厂固件不复现同类日志。
          cp -f $GITHUB_WORKSPACE/scripts/onecloud/loghygiene files/etc/init.d/loghygiene
          chmod 755 files/etc/init.d/loghygiene
          cp -f $GITHUB_WORKSPACE/scripts/onecloud/99-loghygiene files/etc/uci-defaults/99-loghygiene
          chmod 755 files/etc/uci-defaults/99-loghygiene
          # 出厂 system 模板直接修正，不等首启自愈兜底
          if [ -f ./files/etc/config/system ]; then
            sed -i "s/option cronloglevel '5'/option cronloglevel '8'/" ./files/etc/config/system
            sed -i "/option log_proto 'udp'/d" ./files/etc/config/system
            grep -q "option cronloglevel '8'" ./files/etc/config/system || { echo "::error::system cronloglevel 修正失败"; exit 1; }
            if grep -q "option log_proto" ./files/etc/config/system; then echo "::error::system log_proto 未清除"; exit 1; fi
            # NTP: 不提供 server（sysntpd 不加 -l，不监听 123），避免公网 IPv6 暴露
            sed -i "s/option enable_server '1'/option enable_server '0'/" ./files/etc/config/system
            grep -q "option enable_server '0'" ./files/etc/config/system || { echo "::error::system enable_server 修正失败"; exit 1; }
          fi
          # r31: LuCI 概览品牌四行（覆盖官方 10_system.js）
          mkdir -p files/www/luci-static/resources/view/status/include
          cp -f $GITHUB_WORKSPACE/scripts/onecloud/10_system.js files/www/luci-static/resources/view/status/include/10_system.js
          # r36: 构建日期编译期注入（原 JS 正则从 release.description 提取——ubus system board 的
          # description=OPENWRT_RELEASE 字符串不含日期，实机"构建日期"显示空白）→ 占位符直替。
          sed -i "s/__BUILD_DATE__/$(date '+%Y-%m-%d %H:%M')/" files/www/luci-static/resources/view/status/include/10_system.js
          if grep -q '__BUILD_DATE__' files/www/luci-static/resources/view/status/include/10_system.js; then echo "::error::构建日期注入失败"; exit 1; fi

          # r12: rootfs 固定 896M——去掉 rc.local 首启 resize2fs 扩容（不再占满整卡 eMMC）
          sed -i -e '/remount rw/d' -e '/resize2fs/d' ./files/etc/rc.local
          grep -q resize2fs ./files/etc/rc.local && { echo "::error::rc.local 仍含 resize2fs"; exit 1; } || true
          grep -q "1.sh" ./files/etc/rc.local || echo "警告: rc.local 未见 1.sh（初始化链路核对）"

          # openclash 32 位内核（修复版：统一 meta(mihomo) 内核）
          bash $GITHUB_WORKSPACE/scripts/onecloud/openclash32-fixed.sh

          # python3：直接使用官方 feeds（immortalwrt/packages openwrt-25.12 分支解释器位于 lang/python/python3）
          test -d feeds/packages/lang/python/python3 || { echo "::error::feeds/packages/lang/python/python3 缺失，OpenClash 依赖无法满足"; exit 1; }

          # 客户端模式网络配置
          bash $GITHUB_WORKSPACE/recipe/sh/edit_files.sh "${{ env.OWRT_IP }}" "${{ env.OWRT_SERVER_IP }}"

          # r11 LuCI ucode 修复（25.12 apk 体系全线问题）：luci-base 的 postinst（opkg 机制）在 apk 下不执行，
          # /etc/config/uhttpd 停留在官方模板原样——lua_prefix 指向 /usr/lib/lua/luci/sgi/uhttpd.lua（不存在）；
          # 且 uhttpd-mod-ucode 独立包未被依赖链拉入（/usr/lib/uhttpd_ucode.so 缺失）→ /cgi-bin/luci 无法分发 → 浏览器 403
          # 修复：①装 uhttpd-mod-ucode ②files 注入修正版 uhttpd 配置（删 lua_prefix + main 段加 ucode_prefix）
          grep -q '^CONFIG_PACKAGE_uhttpd-mod-ucode=y' .config || echo 'CONFIG_PACKAGE_uhttpd-mod-ucode=y' >> .config
          mkdir -p files/etc/config
          cp -f package/network/services/uhttpd/files/uhttpd.config files/etc/config/uhttpd
          sed -i '/list lua_prefix/d' files/etc/config/uhttpd
          # r21 修复（第六雷）：GNU sed a\ 文本中 \t 被字面化为字母 t，曾写出非法行
          # "tlist ucode_prefix ..."（r11~r20 包内实锤，uci 无法解析）——改 awk printf 写真 TAB
          awk '{print} /option home/{printf "\tlist ucode_prefix\t\"/cgi-bin/luci=/usr/share/ucode/luci/uhttpd.uc\"\n"}' \
            files/etc/config/uhttpd > files/etc/config/uhttpd.tmp && mv files/etc/config/uhttpd.tmp files/etc/config/uhttpd
          TAB=$(printf '\t')
          grep -q "^${TAB}list ucode_prefix" files/etc/config/uhttpd || { echo "::error::ucode_prefix 行首非 TAB（\\t 字面化回归）"; exit 1; }
          grep -q '^tlist' files/etc/config/uhttpd && { echo "::error::tlist 字面化坏行残留"; exit 1; } || true
          grep -q 'ucode_prefix.*uhttpd.uc' files/etc/config/uhttpd || { echo "::error::uhttpd ucode_prefix 注入失败"; exit 1; }
          # r36: 关闭 rfc1918_filter——DNS rebinding 防护拦截 Host 为 RFC1918 私网 IPv4 的请求
          # （实机定性：Host=192.168.1.2 → 403 Forbidden；Host=[fe80::2] 链路本地非 RFC1918 → 正常登录）。
          # 纯局域网管理服务无 rebinding 攻击面，显式置 0。
          sed -i 's/rfc1918_filter 1/rfc1918_filter 0/' files/etc/config/uhttpd
          grep -q 'rfc1918_filter 0' files/etc/config/uhttpd || { echo "::error::rfc1918_filter 关闭失败"; exit 1; }
          # r36: dropbear 出厂配置修正——模板含 option Interface 'lan'，新布局（Bypass 旁路由）无 lan 接口，
          # dropbear 绑定接口失败 → 不监听任何地址 → SSH 无法连接。覆盖为全接口监听（配合 -B 空密码放行）。
          cat > files/etc/config/dropbear << 'DBEOF'
          config dropbear
                  option PasswordAuth 'on'
                  option RootPasswordAuth 'on'
                  option Port '22'
          DBEOF
          grep -q 'Interface' files/etc/config/dropbear && { echo "::error::dropbear 配置含 Interface 残留"; exit 1; } || true
          grep -q "PasswordAuth" files/etc/config/dropbear || { echo "::error::dropbear 配置注入失败"; exit 1; }
          # r42: 出厂空密码（用户指令 1029：OneCloud 25.12 全系出厂 root 无密码）——passwd -d root 置空 hash
          # （LuCI 空hash任意值放行、dropbear -B 下 SSH 可空密码直连）；升级场景恢复的旧 shadow 也会被
          # 首启 uci-defaults 重置为空密码
          cat > files/etc/uci-defaults/99-root-password << 'RPEOF'
          #!/bin/sh
          # 出厂空密码：passwd -d root（r42 用户指令；SSH 空密码直连，LuCI 任意密码可入）
          passwd -d root >/dev/null 2>&1
          RPEOF
          dos2unix files/etc/uci-defaults/99-root-password
          chmod 755 files/etc/uci-defaults/99-root-password
          # r43: luci-app-socat 运行时注入——immortalwrt/官方 luci feed（25.12）均无此包，config 里的
          # CONFIG_PACKAGE_luci-app-socat=y 是幽灵符号会被 defconfig 静默丢弃；lean 应用为纯 lua 脚本
          # （controller/cbi/view），不进 buildroot 编译，直接落 files/（aria2 同款路径），socat CLI 由
          # 真实符号 CONFIG_PACKAGE_socat=y（packages feed）提供
          mkdir -p files/usr/lib/lua/luci/controller files/usr/lib/lua/luci/model/cbi/socat files/usr/lib/lua/luci/view/socat
          for f in luasrc/controller/socat.lua luasrc/model/cbi/socat/index.lua luasrc/model/cbi/socat/config.lua luasrc/view/socat/status.htm luasrc/view/socat/list_status.htm; do
            curl -fsSL "https://raw.githubusercontent.com/coolsnowwolf/luci/master/applications/luci-app-socat/$f" -o "files/usr/lib/lua/luci/${f#luasrc/}" || { echo "::error::luci-app-socat 源拉取失败: $f"; exit 1; }
          done
          curl -fsSL https://raw.githubusercontent.com/coolsnowwolf/luci/master/applications/luci-app-socat/root/etc/config/socat -o files/etc/config/socat
          curl -fsSL https://raw.githubusercontent.com/coolsnowwolf/luci/master/applications/luci-app-socat/root/etc/init.d/luci_socat -o files/etc/init.d/luci_socat
          curl -fsSL https://raw.githubusercontent.com/coolsnowwolf/luci/master/applications/luci-app-socat/root/etc/uci-defaults/luci-app-socat -o files/etc/uci-defaults/luci-app-socat
          chmod 755 files/etc/init.d/luci_socat files/etc/uci-defaults/luci-app-socat
          grep -q '^CONFIG_PACKAGE_socat=y' .config || echo 'CONFIG_PACKAGE_socat=y' >> .config
          test -s files/usr/lib/lua/luci/controller/socat.lua || { echo "::error::luci-app-socat 注入失败"; exit 1; }
          # r44: 出厂即带在线升级命令 upgrade（CLI 化原两步 wget→sh 方案；--check 预检 /
          # --reboot 升级+10s 自动重启；优先在线拉最新 oc-upgrade.sh，失败回退出厂内置 v9）
          cp -f $GITHUB_WORKSPACE/scripts/onecloud/onecloud-online-upgrade.sh files/usr/lib/oc-upgrade.sh
          # v9.14（2026-11-06）：构建期写入精确版本标记，供升级脚本做秒级版本比较。
          #   原先只 export OWRT_DATE 到环境，固件里没有 /etc/oc-version，
          #   导致 upgrade --check 只能靠 openwrt_release 的 (YYYY.MM.DD) 做日粒度比较，
          #   同一天多次编译的固件分不出新旧，可能出现“已是最新”却实际是旧包。
          mkdir -p files/etc
          echo "${OWRT_DATE:?OWRT_DATE 未注入!}" > files/etc/oc-version
          echo "oc-version=$(cat files/etc/oc-version)"
                    mkdir -p files/usr/bin
          cat > files/usr/bin/upgrade << 'UPEOF'
          #!/bin/sh
          # r44: OneCloud 出厂在线升级命令
          # 用法: upgrade --check   预检（只读不改机）
          #       upgrade --reboot  正式升级（写入完成约 10 秒自动重启）
          SRC="https://raw.githubusercontent.com/2286927/ImmortalWrt-MultiDevice/main/scripts/onecloud/onecloud-online-upgrade.sh"
          DST="/tmp/oc-upgrade.sh"
          case "$1" in
              --check) ;;
              --reboot) ;;
              *) echo "用法: upgrade --check | upgrade --reboot"; exit 1 ;;
          esac
          rm -f "$DST"
          if wget -q -T 15 -O "$DST" "$SRC" && [ -s "$DST" ]; then
              echo "已拉取最新升级脚本"
          elif [ -s /usr/lib/oc-upgrade.sh ]; then
              cp /usr/lib/oc-upgrade.sh "$DST"
              echo "在线拉取失败，使用出厂内置升级脚本"
          else
              echo "升级脚本不可用（在线拉取失败且无内置版本）"; exit 1
          fi
          exec sh "$DST" "$@"
          UPEOF
          dos2unix files/usr/lib/oc-upgrade.sh files/usr/bin/upgrade
          chmod 755 files/usr/lib/oc-upgrade.sh files/usr/bin/upgrade
          grep -q -- '--reboot' files/usr/lib/oc-upgrade.sh || { echo "::error::oc-upgrade.sh 内置版异常"; exit 1; }
          grep -qE '^[0-9]{2}\.[0-9]{2}\.[0-9]{2}_[0-9]{2}\.[0-9]{2}\.[0-9]{2}$' files/etc/oc-version || { echo "::error::oc-version 内容格式异常"; exit 1; }
          test -s files/usr/bin/upgrade || { echo "::error::upgrade 命令注入失败"; exit 1; }
          grep -q '    --check) ;;' files/usr/bin/upgrade || { echo "::error::upgrade heredoc TAB 转义损坏"; exit 1; }

      - name: 内核/启动期日志修复（kernlog-fix）
        working-directory: /workdir/openwrt
        run: |
          bash "$GITHUB_WORKSPACE/scripts/common/kernlog-fix/apply-all.sh"
      - name: 下载编译环境
        working-directory: /workdir/openwrt
        run: |
          # r31 守卫: 新布局首启脚本与 LuCI 品牌文件必须在 files 就位
          test -x files/etc/uci-defaults/99-rootfs-grow || { echo "::error::99-rootfs-grow 未注入"; exit 1; }
          test -x files/etc/init.d/loghygiene || { echo "::error::loghygiene 未注入"; exit 1; }
          test -x files/etc/uci-defaults/99-loghygiene || { echo "::error::99-loghygiene 未注入"; exit 1; }
          sh -n files/etc/init.d/loghygiene || { echo "::error::loghygiene 语法错误"; exit 1; }
          test -f files/www/luci-static/resources/view/status/include/10_system.js || { echo "::error::10_system.js 未注入"; exit 1; }
          make defconfig
          # r50 守卫: socat 必须带 OpenSSL（TLS 终结能力）
          #   packages feed 的 net/socat/Makefile 在 CONFIG_SOCAT_SSL!=y 时传 --disable-openssl，
          #   编出的 socat -V 会显示 #undef WITH_OPENSSL，OPENSSL-LISTEN/CONNECT 不可用。
          #   本守卫放在 make defconfig 之后，兜住依赖重新求解。
          if grep -qx 'CONFIG_PACKAGE_socat=y' .config; then
            # 自愈一轮：defconfig 依赖重算若把 SOCAT_SSL 推回 not set，补写后重算一次再判
            if ! grep -qx 'CONFIG_SOCAT_SSL=y' .config || ! grep -qx 'CONFIG_PACKAGE_libopenssl=y' .config; then
              echo ">>> 守卫自愈：defconfig 未保住 socat OpenSSL，补写后重算"
              sed -i '/^# CONFIG_SOCAT_SSL is not set$/d' .config
              grep -qx 'CONFIG_SOCAT_SSL=y' .config || echo 'CONFIG_SOCAT_SSL=y' >> .config
              sed -i '/^# CONFIG_PACKAGE_libopenssl is not set$/d' .config
              grep -qx 'CONFIG_PACKAGE_libopenssl=y' .config || echo 'CONFIG_PACKAGE_libopenssl=y' >> .config
              make defconfig >/dev/null 2>&1 || true
            fi
            if ! grep -qx 'CONFIG_SOCAT_SSL=y' .config || ! grep -qx 'CONFIG_PACKAGE_libopenssl=y' .config; then
              echo "::error::socat 已选但缺 OpenSSL 支持，TLS 终结不可用（自愈一轮后仍未生效）"
              grep -E '^#? ?CONFIG_(SOCAT_SSL|PACKAGE_libopenssl)|^CONFIG_PACKAGE_socat=' .config || true
              exit 1
            fi
            echo "PASS⑭ socat OpenSSL 已开启（SOCAT_SSL=y + libopenssl=y）"
          else
            echo ">>> 本配置未选 socat，跳过 OpenSSL 守卫"
          fi
          # kconfig VARIANT 校正: make defconfig 把 .config 当默认建议，变体自动选择偏向 iptables，
          # 在 defconfig 定型后强制切回 nftables（后续 syncconfig 保留显式值）
          sed -i 's/^CONFIG_PACKAGE_miniupnpd-iptables=y$/# CONFIG_PACKAGE_miniupnpd-iptables is not set/' .config
          grep -q '^CONFIG_PACKAGE_miniupnpd-nftables=y' .config || echo 'CONFIG_PACKAGE_miniupnpd-nftables=y' >> .config
          # r10守卫(弃用 legacy): defconfig 依赖解析不得把 legacy 后端拉回（iptables-mod-* 已禁用，出现即有残留依赖）
          if grep -qE '^CONFIG_PACKAGE_(iptables|ip6tables)-zz-legacy=y' .config; then
            echo "::error::legacy 后端被依赖链拉回（已弃用 fw3+legacy），冲突来源："; grep -E "zz-legacy" .config; exit 1
          fi
          grep -q '^CONFIG_PACKAGE_iptables-nft=y' .config || { echo "::error::iptables-nft 未入选，nft 后端缺失"; exit 1; }
          if grep -q '^CONFIG_PACKAGE_miniupnpd-iptables=y' .config; then
            echo "::error::miniupnpd-iptables 残留（fw4 完全体要求 nftables 变体）"; exit 1
          fi
          echo "=== iptables 后端选择 ==="
          grep -E "^CONFIG_PACKAGE_iptables(-nft)?=" .config || true
          # r11 守卫: uhttpd-mod-ucode 必须入选（LuCI ucode 分发依赖 /usr/lib/uhttpd_ucode.so）
          grep -q '^CONFIG_PACKAGE_uhttpd-mod-ucode=y' .config || { echo "::error::uhttpd-mod-ucode 未入选，LuCI 将 403"; exit 1; }
          # r13 守卫: qmodem 全家零命中（无蜂窝模块，config 已显式 not set；被依赖链拉回即失败）
          if grep -qE '^CONFIG_PACKAGE_(qmodem|luci-app-qmodem(-next)?)=y' .config; then
            echo "::error::qmodem 系被依赖链拉回（设备无蜂窝模块，明确不需要）:"; grep -E '^CONFIG_PACKAGE_.*qmodem' .config; exit 1
          fi
          echo "=== amlogic target 守卫（defconfig 后必须保留） ==="
          grep -E "^CONFIG_TARGET_amlogic=y" .config || { echo "::error::amlogic target 被 defconfig 清除，注入失败"; exit 1; }
          # 单网口精简守卫 r32：fw3/kmod-ipt-ipset/mihomo 系不得在最终 .config 出现
          # （offload/nat/nat6/compat/odhcpd 为 turboacc/dnsmasq-full-dhcpv6/iptables-nft 锁定依赖，白名单放行）
          # r32 根因: Packages.sh 克隆的 nikki 源 mihomo-alpha/meta 互相 DEPENDS（Kconfig 递归依赖），
          #   打破循环后幽灵激活，其 legacy 依赖连坐拉回 kmod-ipt-ipset——自动压回源+症状并二次 defconfig，
          #   二次仍在=真硬依赖，fail 人工裁决
          for _i in 1 2; do
            if grep -qE '^CONFIG_PACKAGE_(firewall|kmod-ipt-ipset|mihomo-alpha|mihomo-meta)=y' .config; then
              echo "第${_i}次压回: $(grep -E '^CONFIG_PACKAGE_(firewall|kmod-ipt-ipset|mihomo-alpha|mihomo-meta)=y' .config | tr '\n' ' ')"
              sed -i -e 's/^CONFIG_PACKAGE_firewall=y/# CONFIG_PACKAGE_firewall is not set/' \
                     -e 's/^CONFIG_PACKAGE_kmod-ipt-ipset=y/# CONFIG_PACKAGE_kmod-ipt-ipset is not set/' \
                     -e 's/^CONFIG_PACKAGE_mihomo-alpha=y/# CONFIG_PACKAGE_mihomo-alpha is not set/' \
                     -e 's/^CONFIG_PACKAGE_mihomo-meta=y/# CONFIG_PACKAGE_mihomo-meta is not set/' .config
              make defconfig >/dev/null 2>&1 || true
            else
              break
            fi
          done
          if grep -qE '^CONFIG_PACKAGE_(firewall|kmod-ipt-ipset|mihomo-alpha|mihomo-meta)=y' .config; then
            echo "::error::单网口精简失败（二次压回仍被拉回，真硬依赖需人工裁决），拉回者:"
            grep -E '^CONFIG_PACKAGE_(firewall|kmod-ipt-ipset|mihomo-alpha|mihomo-meta)=y' .config
            exit 1
          fi
          echo "=== 单网口精简守卫通过（r32 自动压回机制） ==="
          # r36: openssh-server 幽灵回归压回（r27 禁用 5 包被间接 DEPENDS 连坐拉回——Packages.sh 滚动
          # 拉取上游配方激活依赖链；sshd 占 22 端口且 PermitRootLogin prohibit-password 拒空密码 → 出厂 SSH 失效）。
          # r32 mihomo 同款自动压回：写回 not set → defconfig → 二次检查，仍在=真硬依赖 fail 人工裁决。
          for _i in 1 2; do
            if grep -qE '^CONFIG_PACKAGE_(openssh-server|openssh-server-pam|openssh-client|openssh-client-utils|openssh-keygen|openssh-sftp-server|libopenbsd-compat)=y' .config; then
              echo "第${_i}次压回: $(grep -E '^CONFIG_PACKAGE_(openssh|libopenbsd)' .config | tr '\n' ' ')"
              sed -i -E 's/^CONFIG_PACKAGE_(openssh-server(-pam)?|openssh-client(-utils)?|openssh-keygen|openssh-sftp-server|libopenbsd-compat)=y/# CONFIG_PACKAGE_\1 is not set/' .config
              make defconfig >/dev/null 2>&1 || true
            else
              break
            fi
          done
          GUARD_FAIL=$(grep -E '^CONFIG_PACKAGE_(openssh-server|openssh-server-pam|openssh-client|openssh-client-utils)=y' .config || true)
          if [ -n "$GUARD_FAIL" ]; then
            echo "::error::openssh 守护类二次压回仍被拉回（真硬依赖需人工裁决）:"
            echo "$GUARD_FAIL"
            exit 1
          fi
          ACC_LEFT=$(grep -E '^CONFIG_PACKAGE_(openssh-keygen|openssh-moduli|openssh-sftp-server|openssh-sftp-avahi-service|libopenbsd-compat)=y' .config || true)
          if [ -n "$ACC_LEFT" ]; then
            echo "WARNING: openssh 配件类残留（无 init.d/sshd 守护、不占 22 端口、无害放行）: $(echo "$ACC_LEFT" | tr '\n' ' ')"
          fi
          echo "=== openssh 压回守卫通过（r36 守护类清零，配件放行） ==="
          # r40: lighttpd 剔除（r38 config 实锤 CONFIG_PACKAGE_lighttpd=y 出厂携带；luci-app 全清单零依赖方——
          #   配方作者历史遗留显式选择，当前无软件用到。开机 init 抢占 IPv4:80 致 192.168.1.2 403 Forbidden
          #   （uhttpd rfc1918_filter=0 无辜，fe80::2 正常即旁证）。按用户裁决移除，80 归还 uhttpd。
          #   mihomo/openssh 同款二次压回：defconfig 后仍在=真硬依赖 fail 人工裁决（备选=改端口 8080）
          for _i in 1 2; do
            if grep -qE '^CONFIG_PACKAGE_lighttpd=y' .config; then
              echo "第${_i}次压回: lighttpd"
              sed -i 's/^CONFIG_PACKAGE_lighttpd=y$/# CONFIG_PACKAGE_lighttpd is not set/' .config
              make defconfig >/dev/null 2>&1 || true
            else
              break
            fi
          done
          grep -q '^CONFIG_PACKAGE_lighttpd=y' .config && { echo "::error::lighttpd 被依赖链拉回（真硬依赖需人工裁决：改端口 8080 方案）"; grep -E '^CONFIG_PACKAGE_lighttpd' .config; exit 1; }
          echo "=== lighttpd 剔除守卫通过（80 端口归还 uhttpd） ==="
          # r56: 配合本次新增的 dl 缓存，改为「清单体检 + 只删空文件/HTML 错误页」。
          #   原实现按 <1KB 无差别删除（连合法小文件一起删），与 dl 缓存叠加会形成
          #   「恢复 → 删 → 重下 → 再删」的死循环，缓存收益被完全抹平。
          if [ -f dl/.dl-manifest ]; then
            _bad=0
            while read -r _sz _p; do
              [ -n "$_p" ] && [ -f "dl/$_p" ] || continue
              if [ "$(stat -c%s "dl/$_p" 2>/dev/null || echo -1)" != "$_sz" ]; then
                echo "剔除半截: dl/$_p"; rm -f "dl/$_p"; _bad=$((_bad + 1))
              fi
            done < dl/.dl-manifest
            echo "dl 体检剔除 $_bad 个"
          fi
          make download -j8
          ( cd dl && find . -type f ! -name '.dl-manifest' -printf '%s %p\n' | sed 's# \./# #' | sort -k2 > .dl-manifest )
          # 只删空文件与 HTML 错误页（不再按 <1KB 无差别删）
          find dl -maxdepth 1 -type f -size -1024c -print0 | while IFS= read -r -d '' _f; do
            if [ ! -s "$_f" ] || head -c 512 "$_f" | grep -qiE '<!doctype|<html|404 not found|403 forbidden'; then
              echo "删除无效下载: $_f"; rm -f "$_f"
            fi
          done
          echo "dl 文件数: $(find dl -type f ! -name '.dl-manifest' | wc -l)  合计: $(du -sh dl | cut -f1)"

      - name: 内核先行编译（补丁/kconfig 问题提前暴露）
        working-directory: /workdir/openwrt
        timeout-minutes: 60
        run: |
          # r56: 原探针 `make target/linux/prepare` 实测无效——run 42487148698 里它 0.4 分钟即「通过」，
          #   而 run 42473647210 里补丁打不上时它照样绿；真问题要等 make world 跑到 50 分钟才以
          #   「target/linux failed to build」呈现且不带细节。
          # 改为先把内核单独编出来：world 的第一步本来就是它，总时间不变，
          #   但补丁 / kconfig 失败会在 ~10 分钟带 V=s 明细失败，并写进 kernel.log 供 artifact 上传。
          set +e
          stdbuf -oL -eL make -j$(nproc) target/linux/compile V=s 2>&1 | stdbuf -oL tee kernel.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::error::内核编译失败 rc=$RC（补丁 / kconfig），关键行如下"
            grep -nE 'Hunk|hunk|patch|Patch|fuzz|Rejected|Error [0-9]|error:' kernel.log | tail -n 60 || true
            exit "$RC"
          fi
          echo ">>> 内核编译通过（world 阶段复用同一 build_dir，不重复编）"

      - name: 编译固件
        working-directory: /workdir/openwrt
        timeout-minutes: 300
        run: |
          echo -e "$(nproc) thread compile"
          : > build.log
          set +e
          stdbuf -oL -eL make -j$(nproc) 2>&1 | stdbuf -oL tee build.log
          RC=${PIPESTATUS[0]}
          set -e
          # 兜底只认内存耗尽：其余失败重跑 -j1 只会把 108min 变 216min，还把真因埋掉
          if [ "$RC" -ne 0 ] && grep -qE 'virtual memory exhausted|internal compiler error: Killed|Killed signal|Cannot allocate memory|out of memory' build.log; then
            echo "::warning::疑似内存耗尽（rc=$RC），降 -j1 重试，日志追加"
            set +e
            stdbuf -oL -eL make -j1 2>&1 | stdbuf -oL tee -a build.log
            RC=${PIPESTATUS[0]}
            set -e
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::warning::编译失败 rc=$RC，用 V=s 复跑失败目标以定位（输出追加进 build.log）"
            _tgt=$(grep -oE '\-C [^ ]+ compile' build.log | tail -1 | awk '{print $2}')
            echo ">>> 失败目标推断: ${_tgt:-未知}"
            set +e
            if [ -n "$_tgt" ]; then
              stdbuf -oL -eL make -j1 V=s "$_tgt/compile" 2>&1 | stdbuf -oL tee -a build.log
            else
              stdbuf -oL -eL make -j1 V=s 2>&1 | stdbuf -oL tee -a build.log
            fi
            set -e
            echo "::error::编译失败 rc=$RC，build.log 末尾 150 行："
            tail -n 150 build.log
            exit "$RC"
          fi
          echo ">>> 编译完成，build.log 行数: $(wc -l < build.log)"

      - name: 构建摘要
        if: always()
        working-directory: /workdir/openwrt
        run: |
          {
            echo "## 构建摘要"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 分支 | ${REPO_BRANCH} |"
            echo "| 版本戳 | ${OWRT_DATE} |"
            if [ -d dl ]; then
              echo "| dl 源码包 | $(find dl -type f | wc -l) 个文件 / $(du -sh dl | cut -f1) |"
            fi
            for _f in outfile/*.tar.gz outfile/*.tar outfile/*.img.xz; do
              if [ -f "$_f" ]; then echo "| 产物 | $(basename "$_f") ($(du -h "$_f" | cut -f1)) |"; fi
            done || true
          } >> $GITHUB_STEP_SUMMARY

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@main
        with:
          name: build-log-onecloud-${{ env.REPO_BRANCH }}-${{ env.OWRT_DATE }}
          path: |
            openwrt/build.log
            openwrt/kernel.log
            openwrt/.config
          retention-days: 7
          if-no-files-found: warn

      - name: r36 终检（线刷病灶八断言）
        working-directory: /workdir/openwrt
        run: |
          RFS_TAR=$(ls bin/targets/*/*/immortalwrt-*-rootfs.tar.gz 2>/dev/null | head -1)
          test -n "$RFS_TAR" || { echo "::error::rootfs.tar.gz 未找到"; exit 1; }
          echo "终检对象: $RFS_TAR"
          if tar -tzf "$RFS_TAR" | grep -qE '^\./?etc/init\.d/sshd$'; then echo "::error::①init.d/sshd 存在（openssh 幽灵回归）"; exit 1; else echo "PASS① 无 init.d/sshd"; fi
          if tar -xzOf "$RFS_TAR" ./etc/config/dropbear 2>/dev/null | grep -Eq "^[[:space:]]*option[[:space:]]+Interface"; then echo "::error::②dropbear Interface 绑定残留"; exit 1; else echo "PASS② dropbear 全接口监听"; fi
          tar -xzOf "$RFS_TAR" ./etc/init.d/dropbear 2>/dev/null | grep -q -- ' -B ' || { echo "::error::③dropbear -B 注入丢失"; exit 1; }
          echo "PASS③ dropbear -B 在位"
          tar -xzOf "$RFS_TAR" ./etc/config/uhttpd 2>/dev/null | grep -q 'rfc1918_filter 0' || { echo "::error::④rfc1918_filter 未关闭"; exit 1; }
          echo "PASS④ rfc1918_filter=0"
          if tar -xzOf "$RFS_TAR" ./etc/init.d/aria2 2>/dev/null | grep -q 'procd_add_jail'; then echo "::error::⑤aria2 jail 残留"; exit 1; else echo "PASS⑤ aria2 无 jail"; fi
          tar -xzOf "$RFS_TAR" ./usr/lib/lua/luci/model/cbi/aria2.lua 2>/dev/null | grep -q 'or "unknown"' || { echo "::error::⑥aria2 cbi 防护缺失"; exit 1; }
          echo "PASS⑥ aria2 cbi 防护在位"
          tar -xzOf "$RFS_TAR" ./etc/diymo.sh 2>/dev/null | grep -q 'sleep 30' || { echo "::error::⑦diymo dockerd 延迟缺失"; exit 1; }
          echo "PASS⑦ diymo dockerd 延迟在位"
          if tar -xzOf "$RFS_TAR" ./www/luci-static/resources/view/status/include/10_system.js 2>/dev/null | grep -q '__BUILD_DATE__'; then echo "::error::⑧构建日期未注入"; exit 1; else echo "PASS⑧ 构建日期已注入"; fi
          tar -xzOf "$RFS_TAR" ./etc/uci-defaults/99-root-password 2>/dev/null | grep -q 'passwd -d root' && echo "PASS⑨ 出厂空密码脚本在位" || { echo "::error::⑨99-root-password 缺失"; exit 1; }
          if ! tar -xzOf "$RFS_TAR" ./usr/lib/lua/luci/controller/socat.lua 2>/dev/null | grep -q 'entry'; then echo "::error::⑩luci-app-socat lua 注入缺失"; exit 1; fi
          if ! tar -tzf "$RFS_TAR" | grep -qE '^\./?usr/(s?bin)/socat$'; then echo "::error::⑩socat CLI 缺失"; exit 1; fi
          echo "PASS⑩ luci-app-socat + socat CLI 在位"
          tar -xzOf "$RFS_TAR" ./usr/bin/upgrade 2>/dev/null | grep -q 'oc-upgrade' || { echo "::error::⑪upgrade 命令缺失"; exit 1; }
          tar -xzOf "$RFS_TAR" ./usr/lib/oc-upgrade.sh 2>/dev/null | grep -q -- '--reboot' || { echo "::error::⑪内置 oc-upgrade.sh 缺失"; exit 1; }
          echo "PASS⑪ upgrade 升级命令在位（--check/--reboot）"

      - name: 制作直刷包
        run: |
          # r31: convert3 新布局版——rootfs 1024M + 品牌定制；r13 基础上 boot 仍从本次产物提取
          # r13: 主仓修复版 convert3——boot 从本次编译产物 p1 提取（原配方静态素材 boot
          # 内核与 rootfs kmod 断配，线刷即残）+ rootfs 896M + 内核版本硬断言
          bash $GITHUB_WORKSPACE/scripts/onecloud/convert3.sh
          echo "=== 直刷包产物 ==="
          ls -lh openwrt/bin/targets/*/*/*.burn.img.xz 2>/dev/null || true

      - name: 整理固件
        id: organize
        run: |
          cd openwrt
          mkdir outfile
          cp -rf bin/targets/*/*/*.tar ./outfile
          cp -rf bin/targets/*/*/*.xz ./outfile
          # r41-fix: 整理固件补 boot 资产——convert3.sh 产出 onecloud-boot.tar.gz 落 bin/targets/*/*/，
          #   *.tar/*.xz glob 均不匹配 *.tar.gz（r19 第五雷同款），r31 重写整理段后复发，
          #   致 r36-r40 Release 缺 boot 资产（在线升级 boot 下载 404 阻断）。
          #   10-28 已从 r39/r40 burn.img p1 提取重打包补传两 Release（sha256 存档），本行为根治。
          cp -f bin/targets/*/*/onecloud-boot.tar.gz ./outfile/
          cp -rf .config ./outfile/config.txt
          rm -rf bin/targets/*/*/packages

          cd outfile
          if [[ $REPO_URL == *"immortalwrt"* ]]; then
            gzip *.tar
          fi

          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          ls -lh $PWD

      - name: 上传 artifacts
        # r57（对齐 UP r57）：账号 Actions 存储配额曾被打满（run 42954571276：Failed to CreateArtifact:
        #   Artifact storage quota has been hit），原实现该步失败会连带跳过「上传直刷固件」「发布到固件仓」。
        #   ① 保留期 15→3 天（404MB/次，Release 与固件仓已完整留档）；
        #   ② 失败不阻断，配额满只丢 artifact；
        #   ③ 产物体已是 xz/gz，compression-level: 0 免二次压缩。
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: onecloud-${{ env.REPO_BRANCH }}-${{ env.OWRT_DATE }}
          path: openwrt/outfile/*
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn

      - name: 上传直刷固件
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: OneCloud_${{ env.REPO_BRANCH }}_${{ env.OWRT_DATE }}
          body: |
            玩客云（OneCloud S805）一站式直刷固件
            请使用双USB公头线刷机！
            ========== 基本信息 ==========
            源码：immortalwrt
            分支：${{ env.REPO_BRANCH }}
            默认密码：空（root 无密码；SSH 空密码直连，LuCI 任意密码进入）
            默认地址：${{ env.OWRT_IP }}
          artifacts: "openwrt/outfile/*"

      - name: 缓存额度治理
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # r55：原实现用 `gh cache list --json ... -q`，在本 runner 上不产出内容，
          #   管道空转 → 一条缓存也没删（实测 run 42478524723 治理前后列表完全相同）。
          #   改为 gh api 取原始 JSON + python3 解析，逐条删除并打印 rc/错误。
          python3 - "${{ github.repository }}" "${REPO_BRANCH}" <<'PY'
          import json, subprocess, sys

          repo, br = sys.argv[1], sys.argv[2]


          def api(path, method='GET'):
              r = subprocess.run(['gh', 'api', '-X', method, path], capture_output=True, text=True)
              return r.returncode, r.stdout, r.stderr


          rc, out, err = api('/repos/%s/actions/caches?per_page=100' % repo)
          if rc != 0:
              print('::warning::读取缓存列表失败 rc=%d %s' % (rc, err[:200]))
              raise SystemExit(0)
          items = json.loads(out or '{}').get('actions_caches', [])
          total = sum(x['size_in_bytes'] for x in items) / 1073741824
          print('=== 治理前：%d 条，合计 %.2f GB ===' % (len(items), total))
          for x in sorted(items, key=lambda y: -y['size_in_bytes'])[:8]:
              print('  %6.2f GB  %s' % (x['size_in_bytes'] / 1073741824, x['key'][:66]))


          def rm(why, x):
              rc, out, err = api('/repos/%s/actions/caches/%s' % (repo, x['id']), 'DELETE')
              print('  删 %-18s %6.2f GB rc=%d %s' % (why, x['size_in_bytes'] / 1073741824, rc,
                                                    (err or '').strip()[:90]))


          # ① dl：同分支只留最新（跨月旧 key 是最大浪费，实测有一条 2.61 GB 的 202610）
          dl = sorted([x for x in items if x['key'].startswith('dl-%s-' % br)],
                      key=lambda x: x['created_at'], reverse=True)
          for x in dl[1:]:
              rm('dl 旧条目', x)
          # ② cachewrtbuild：key 含 run_id，每轮新增一条，只留最新
          am = sorted([x for x in items if x['key'].startswith('amlogic6.6/')],
                      key=lambda x: x['created_at'], reverse=True)
          for x in am[1:]:
              rm('cachewrtbuild 旧', x)
          # ③ 源码指纹：留最近 6 条
          fp = sorted([x for x in items if x['key'].startswith('fp-')],
                      key=lambda x: x['created_at'], reverse=True)
          for x in fp[6:]:
              rm('指纹旧条目', x)

          rc, out, err = api('/repos/%s/actions/caches?per_page=100' % repo)
          if rc == 0:
              items = json.loads(out or '{}').get('actions_caches', [])
              print('=== 治理后：%d 条，合计 %.2f GB ===' % (
                  len(items), sum(x['size_in_bytes'] for x in items) / 1073741824))
          PY
      - name: 记录源码指纹（仅全流程成功）
        if: success() && needs.check-updates.outputs.fingerprint != ''
        run: |
          mkdir -p .fp
          echo "${{ needs.check-updates.outputs.fingerprint }}" > .fp/fingerprint
          cat .fp/fingerprint

      - name: 保存源码指纹
        if: success() && needs.check-updates.outputs.fingerprint != ''
        uses: actions/cache/save@v5
        with:
          path: .fp
          key: fp-${{ env.REPO_BRANCH }}-${{ needs.check-updates.outputs.fingerprint }}

      - name: SSH 调试
        if: failure() && inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
