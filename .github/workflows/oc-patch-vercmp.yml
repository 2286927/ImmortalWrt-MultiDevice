name: oc-patch-vercmp
# 一次性补丁（执行后自删）：给 scripts/onecloud/onecloud-online-upgrade.sh 注入 v9.12
# 版本比较逻辑——本机已是最新时 upgrade --check 不再下载 rootfs/boot 包。
on:
  push:
    paths:
      - '.github/workflows/oc-patch-vercmp.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject v9.12 version-compare block
        run: |
          set -euo pipefail
          F=scripts/onecloud/onecloud-online-upgrade.sh
          if grep -q 'v9.12' "$F"; then echo "ALREADY_PATCHED"; exit 0; fi
          cat > /tmp/block.sh <<'BLOCK'
          # ---------------- 版本比较（v9.12：无更新短路，杜绝无谓下载） ----------------
          # 2026-10-31 实机反馈：本机已是最新固件，upgrade --check 仍完整下载 rootfs+boot。
          # 根因：原实现只有"探测→下载→校验"，没有"当前版本 vs 目标版本"比较。
          # 版本标识优先级：
          #   ① /etc/oc-version（构建期写入 OWRT_DATE=yy.mm.dd_hh.mm.ss，精确到秒）→ 精确比较
          #   ② /etc/openwrt_release 的 DISTRIB_DESCRIPTION 构建日期（YYYY.MM.DD）→ 仅日粒度
          # 日粒度命中只在 --check 下短路；--reboot 继续（同一天可能多次构建，正式升级宁可
          # 多下一次包，也不误挡真实新版本）。--force 跳过本段比较。
          TAG_VER=$(echo "$URL_ROOTFS" | sed -n 's|.*/releases/download/\([^/]*\)/.*|\1|p')
          [ -n "$TAG_VER" ] || TAG_VER="${TAG:-}"
          NEW_VER=$(echo "$TAG_VER" | sed -n 's/.*_\([0-9][0-9]\.[0-9][0-9]\.[0-9][0-9]_[0-9][0-9]\.[0-9][0-9]\.[0-9][0-9]\)$/\1/p')
          CUR_VER=$(sed -e 's/[[:space:]]//g' /etc/oc-version 2>/dev/null)
          CUR_DAY=$(sed -n 's/.*(\([0-9][0-9][0-9][0-9]\.[0-9][0-9]\.[0-9][0-9]\)).*/\1/p' /etc/openwrt_release 2>/dev/null | head -n1)
          NEW_DAY=$(echo "$NEW_VER" | sed -n 's/^\([0-9][0-9]\)\.\([0-9][0-9]\)\.\([0-9][0-9]\)_.*/20\1.\2.\3/p')
          log "版本核对: 本机 ${CUR_VER:-未标记}${CUR_DAY:+（构建日 $CUR_DAY）} | 目标 ${NEW_VER:-未知}（TAG=${TAG_VER:-?}）"
          if [ "$FORCE" = "yes" ]; then
            log "--force 指定：跳过版本比较，按目标版本完整执行"
          elif [ -n "$NEW_VER" ] && [ -n "$CUR_VER" ] && [ "$CUR_VER" = "$NEW_VER" ]; then
            log "=========================================="
            log "已是最新固件（本机 $CUR_VER == 目标 $NEW_VER），无需升级"
            log "未下载任何包、未做任何修改。强制重刷同版本: sh $0 --force"
            log "=========================================="
            exit 0
          elif [ -n "$NEW_DAY" ] && [ -n "$CUR_DAY" ] && [ "$CUR_DAY" = "$NEW_DAY" ] && [ "$CHECK_ONLY" = "yes" ]; then
            log "=========================================="
            log "本机构建日 $CUR_DAY 与最新 Release 同日（$TAG_VER），判定无可用更新"
            log "未下载任何包、未做任何修改（同日多次构建无法区分时刻——本机无 /etc/oc-version）"
            log "确需核对/升级同日版本: sh $0 --check --force"
            log "=========================================="
            exit 0
          fi
          BLOCK
          python3 - <<'PYEOF'
          import sys
          p = 'scripts/onecloud/onecloud-online-upgrade.sh'
          s = open(p, encoding='utf-8').read()
          if 'v9.12' in s:
              print('ALREADY_PATCHED'); sys.exit(0)
          block = open('/tmp/block.sh', encoding='utf-8').read().rstrip('\n')
          def rep(old, new, tag):
              global s
              assert s.count(old) == 1, 'anchor missing: ' + tag
              s = s.replace(old, new, 1)
          rep('CHECK_ONLY="no"\nfor a in "$@"; do',
              'CHECK_ONLY="no"\nFORCE="no"\nfor a in "$@"; do', 'force-init')
          rep('    --reboot) REBOOT="yes" ;;',
              '    --reboot) REBOOT="yes" ;;\n    --force) FORCE="yes" ;;', 'force-arg')
          rep('log "下载 rootfs 包: $URL_ROOTFS"',
              block + '\n\n' + 'log "下载 rootfs 包: $URL_ROOTFS"', 'vercmp')
          note = (
            '#   13. v9.12（2026-10-31 实机反馈）：无更新短路——原实现只有"探测→下载→校验"，缺少\n'
            '#       "当前版本 vs 目标版本"比较，导致本机已是最新时 upgrade --check 仍完整下载\n'
            '#       rootfs(约162MB)+boot(约10.5MB)。现在探测到目标后先比对：/etc/oc-version\n'
            '#       （构建期写入 yy.mm.dd_hh.mm.ss）精确命中即直接退出；无该文件时用\n'
            '#       DISTRIB_DESCRIPTION 里的构建日期做日粒度判定（仅 --check 短路，--reboot 不误挡）。\n'
            '#       新增 --force 跳过比较（强制重刷同版本）\n')
          rep('#   8. v8（2026-10-26）：--reboot 改 nohup 后台执行',
              note + '#   8. v8（2026-10-26）：--reboot 改 nohup 后台执行', 'header')
          open(p, 'w', encoding='utf-8').write(s)
          print('PATCHED')
          PYEOF
          sh -n "$F"
          grep -c 'v9.12' "$F"
          git config user.name "oc-patch-bot"
          git config user.email "oc-patch-bot@users.noreply.github.com"
          git rm -q .github/workflows/oc-patch-vercmp.yml
          git add "$F"
          git commit -m "fix(upgrade): v9.12 无更新短路，--check 已是最新时不再下载固件包"
          git push
