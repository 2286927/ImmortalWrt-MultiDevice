#========================================================================================================================
# 玩客云（OneCloud / Amlogic S805 meson8b cortex-a5 32位）直刷固件
# 方案来源：旧仓库 2286927/OneCloud_immortalwrt 成功配方（commit 6cb5de77，2026-04-17 / 05-04 两次编译成功）
#   1. immortalwrt 官方源码无 amlogic target，注入 coolsnowwolf/lede master 的 amlogic 树（KERNEL_PATCHVER 改 6.6 与 24.10 generic 匹配；配方仓库仅提供 config/脚本）
#   2. 配置使用配方仓库 Config/quicker-amlogic.config（32 位 meson8b 专用）
#   3. convert3.sh 制作 AmlImg 直刷包（含 uboot，双USB公头线刷）
# 上游适配修复（原 16 连败根因）：vernesong/OpenClash core 分支改版——premium/ 目录删除、classic dev 内核停发，
#   openclash32.sh 修复版统一安装 meta(mihomo) armv7 内核（scripts/onecloud/openclash32-fixed.sh）
#========================================================================================================================
name: ImmortalWrt-24.10-ONECLOUD

on:
  repository_dispatch:
    types: [build_firmware]
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
      force_build:
        description: '强制构建（false=仅在源码/配方/配置有变化时构建）'
        required: false
        default: 'true'
  schedule:
    - cron: "30 19 * * 5"

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  RECIPE_REPO: https://github.com/2286927/OneCloud_immortalwrt
  RECIPE_REF: 390f150fc256e38a4b21311cb1cbb9f3d367c590
  OWRT_IP: 172.16.8.1
  OWRT_NAME: OneCloud
  OWRT_CFG: recipe/Config/quicker-amlogic.config
  OWRT_FILES: recipe/onecloud/files
  TZ: Asia/Shanghai

permissions:
  contents: write
  actions: write

jobs:
  check-updates:
    name: 检测源码/配方是否更新
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
    steps:
      - name: 计算三源指纹
        id: fp
        run: |
          set -eu
          UP_SHA=$(git ls-remote "${{ env.REPO_URL }}" "refs/heads/${{ env.REPO_BRANCH }}" | cut -f1)
          LEDE_SHA=$(git ls-remote https://github.com/coolsnowwolf/lede refs/heads/master | cut -f1)
          SELF_SHA="${{ github.sha }}"
          [ -n "$UP_SHA" ] && [ -n "$LEDE_SHA" ] || { echo "::error::上游 HEAD 解析失败"; exit 1; }
          FP=$(printf '%s\n%s\n%s\n' "$UP_SHA" "$LEDE_SHA" "$SELF_SHA" | sha256sum | cut -c1-32)
          echo "上游=$UP_SHA  lede=$LEDE_SHA  本仓=$SELF_SHA"
          echo "fingerprint=$FP" >> $GITHUB_OUTPUT

      - name: 指纹比对（缓存 key 即指纹，命中=无更新）
        id: fpc
        uses: actions/cache/restore@v5
        with:
          path: .fp
          key: fp-${{ env.REPO_BRANCH }}-${{ steps.fp.outputs.fingerprint }}

      - name: 判定是否构建
        id: decide
        run: |
          E='${{ github.event_name }}'; F='${{ inputs.force_build }}'; H='${{ steps.fpc.outputs.cache-hit }}'
          GO=true
          if [ "$H" = "true" ] && { [ "$E" = "schedule" ] || { [ "$E" = "workflow_dispatch" ] && [ "$F" = "false" ]; }; }; then GO=false; fi
          echo "should_build=$GO" >> $GITHUB_OUTPUT
          echo ">>> should_build=$GO（事件=$E 指纹命中=$H force=$F）"

  build-onecloud:
    name: 玩客云 amlogic 直刷固件
    needs: check-updates
    if: always() && needs.check-updates.outputs.should_build != 'false'
    runs-on: ubuntu-24.04
    steps:
      - name: 清理服务器空间(Ubuntu)
        uses: rmoyulong/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout 主仓库
        uses: actions/checkout@v5

      - name: 初始化编译环境
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # r52（对齐 UP r48）：抑制 needrestart。
          #   apt 结束后它会主动重启服务，子进程占住 stdout 管道不放，表现在 GitHub 侧是：
          #   脚本已执行完（末行 df -Th 正常输出）、日志不再前进、步骤永远 in_progress、
          #   最终 job 收尾空转被判失败且日志 blob 不归档。
          #   实证：2026-11-07 run 42337618785 第 4 步卡住 8 分钟+；2026-11-06 UP run #7 同因失联。
          export NEEDRESTART_SUSPEND=1
          # 双保险：NEEDRESTART_SUSPEND 经 sudo -E 可能被 sudoers 的 env_reset 过滤，
          #   直接写配置，restart="l" = 只列出待重启服务、绝不自动重启。
          sudo mkdir -p /etc/needrestart/conf.d
          echo '$nrconf{restart} = "l";' | sudo tee /etc/needrestart/conf.d/99-ci-no-restart.conf >/dev/null
          echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
          sudo -E apt-get -qq update --fix-missing
          # r52（对齐 UP r47b）：去掉 full-upgrade。
          #   CI 每次升级整个 Ubuntu 既慢又没必要——编译只依赖工具链与构建工具，
          #   83 包的依赖清单已覆盖；实测同步骤耗时在 2m46s ~ 65min 之间漂移，全看当次待升级包数量。
          # sudo -E apt-get -qq -y full-upgrade
          # r50：依赖清单改为读仓库内文件，不再联网拉取外部 URL。
          # 外部清单一挂或内容被改，构建就直接红；本地文件改动会留 git 记录。
          DEPFILE="$GITHUB_WORKSPACE/config/Ubuntu-2410.txt"
          test -f "$DEPFILE" || { echo "::error::依赖清单缺失：$DEPFILE"; exit 1; }
          PKGS=$(grep -vE '^\s*#|^\s*$' "$DEPFILE" | tr '\n' ' ')
          test -n "$PKGS" || { echo "::error::依赖清单为空：$DEPFILE"; exit 1; }
          echo "依赖包数量: $(echo $PKGS | wc -w)"
          # r52（对齐 UP r49）：给依赖安装设硬上限，超时不再拖死整个构建；
          #   runner 到 apt 源带宽实测约 150KB/s，装不完时宁可带着已有工具继续编译。
          set +e
          sudo timeout 900 env NEEDRESTART_SUSPEND=1 apt-get -qq -y --no-upgrade --no-install-recommends \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
            -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold \
            install $PKGS
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::warning::依赖安装未在 15 分钟内完成（rc=$RC），恢复 dpkg 状态后继续构建"
            sudo dpkg --configure -a || true
          else
            echo "依赖安装完成"
          fi
          sudo -E apt-get -qq -y --no-upgrade --no-install-recommends install android-sdk-libsparse-utils dos2unix xz-utils || true
          # r52（对齐 UP r48）：移除 autoremove --purge。
          #   一次性容器无清理收益；镜像变动后它会批量删包并触发 needrestart，
          #   是 runner 失联的高风险源。
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          df -Th

      - name: 初始化变量
        run: |
          export OWRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV
          echo "OWRT_SERVER_IP=${OWRT_IP%.*}.1" >> $GITHUB_ENV

      - name: 克隆源仓库
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 拉取成功配方仓库并适配路径
        run: |
          git clone $RECIPE_REPO recipe
          cd recipe && git checkout $RECIPE_REF
          # 配方脚本内部的 $GITHUB_WORKSPACE/xxx 引用统一指向 recipe 子目录
          sed -E -i 's#\$GITHUB_WORKSPACE/(sh|lede6|onecloud|ax6|Config|Ubuntu)#\$GITHUB_WORKSPACE/recipe/\1#g' sh/*.sh
          # r13.4: 剔除 qmodem 包源（上游 964d8dd325 3.4.0_rc3 包族重构撞 UPDATE_PACKAGE 滚动拉取，
          # 玩客云无 SIM 卡槽纯冗余负载；与 25.12 线 r13.1 qmodem 禁用对齐）
          sed -i '/UPDATE_PACKAGE.*[Qq]modem/d' sh/Packages.sh
          if grep -qi 'qmodem' sh/Packages.sh; then
            echo "::error::Packages.sh 仍有 qmodem 引用:"; grep -in qmodem sh/Packages.sh; exit 1
          fi
          dos2unix sh/*.sh
          chmod +x sh/*.sh
          echo "配方仓库: $(git log -1 --format='%h %s')"

      - name: 注入 amlogic target 树(核心修复·lede master 源)
        working-directory: /workdir/openwrt
        run: |
          # 24.10 树 generic 为 6.6 内核 → 采用 lede master amlogic 树的 6.6 testing（活跃维护源）
          # 与 25.12 线同源 coolsnowwolf/lede；配方仓库(recipe)仅提供 config/脚本/files
          git clone --depth 1 https://github.com/coolsnowwolf/lede /tmp/lede-tree
          rm -rf target/linux/amlogic
          mv /tmp/lede-tree/target/linux/amlogic target/linux/amlogic
          rm -rf /tmp/lede-tree
          sed -i -e "s/KERNEL_PATCHVER:=6.18/KERNEL_PATCHVER:=6.6/" \
                 -e "/KERNEL_TESTING_PATCHVER/d" \
                 -e "/autocore-arm/d" \
                 -e "s/ pci pcie//" \
                 target/linux/amlogic/Makefile
          # meson8b CPU_SUBTYPE 改回 neon-vfpv4（与历史树一致）：S805 的 A5 支持 NEON（实测多年），
          # 且必须匹配 cachewrtbuild 缓存里的 toolchain-arm_cortex-a5+neon-vfpv4_* 目录名——
          # 该 action 命中缓存后会删 Makefile 的 toolchain stamp 依赖跳过工具链构建，
          # 若目录名因 vfpv4 变化，恢复的缓存里没有对应 toolchain，内核 syncconfig 找不到 gcc 直接失败
          sed -i "s/CPU_SUBTYPE:=vfpv4/CPU_SUBTYPE:=neon-vfpv4/" target/linux/amlogic/meson8b/target.mk
          # 跨版本 kconfig 新符号预置（25.12 线 r8 同款实证修复）：lede meson8b config-6.6 缺
          # MDIO_BUS_MUX_MESON_GXL（无默认值符号），内核 syncconfig 非交互遇 (NEW) 询问 EOF 直接失败
          grep -q "^CONFIG_MDIO_BUS_MUX_MESON_GXL=" target/linux/amlogic/meson8b/config-6.6 || echo "CONFIG_MDIO_BUS_MUX_MESON_GXL=m" >> target/linux/amlogic/meson8b/config-6.6
          # 删 FAIL_ON_UNCONFIGURED 开关（25.12 线 r8 同款）：其余 kconfig 新符号按默认值静默取值，防 syncconfig 交互 EOF
          sed -i '/export FAIL_ON_UNCONFIGURED=1/d' include/kernel-build.mk
          chmod -Rf 755 target/linux/amlogic
          echo "=== amlogic target 树 ==="
          ls target/linux/amlogic
          echo "=== 树内核版本 ==="
          grep -E "KERNEL_PATCHVER" target/linux/amlogic/Makefile
          test -d target/linux/amlogic/patches-6.6 || { echo "::error::patches-6.6 缺失"; exit 1; }
          test -f target/linux/amlogic/meson8b/target.mk || { echo "::error::meson8b 缺失"; exit 1; }
          grep -q "CPU_SUBTYPE:=neon-vfpv4" target/linux/amlogic/meson8b/target.mk || { echo "::error::meson8b CPU_SUBTYPE 未改为 neon-vfpv4（toolchain 缓存目录名不匹配）"; exit 1; }
          grep -q "^CONFIG_MDIO_BUS_MUX_MESON_GXL=m" target/linux/amlogic/meson8b/config-6.6 || { echo "::error::MDIO_BUS_MUX_MESON_GXL 未预置（kconfig NEW 符号会致 syncconfig 失败）"; exit 1; }

      - name: 设置订阅源
        working-directory: /workdir/openwrt
        run: |
          bash $GITHUB_WORKSPACE/recipe/sh/setup.sh
          echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: 启动缓存[第二次起生效]
        uses: rmoyulong/cachewrtbuild@main
        with:
          ccache: 'true'
          prefix: ${{ github.workspace }}/openwrt
          mixkey: amlogic6.6/tree/${{ env.REPO_BRANCH }}?device=quicker-amlogic

      - name: 配置 ccache 上限
        working-directory: /workdir/openwrt
        run: |
          mkdir -p .ccache
          printf 'max_size = 1.0G\ncompression = true\n' > .ccache/ccache.conf
          echo "=== ccache 目录现状（首跑为 0，第 2 次起应 ≥1G）==="
          du -sh .ccache
          df -h . | tail -1

      - name: 安装订阅源
        working-directory: /workdir/openwrt
        timeout-minutes: 30
        run: |
          # r54: 关掉 git 自动 gc/维护 —— gc 后台进程会继承 stdout 管道，
          #   导致脚本已跑完而 GitHub 认为步骤未结束（run 42347873605 实证：日志已到末行 df，步骤仍 in_progress）。
          git config --global gc.auto 0 || true
          git config --global maintenance.auto false || true
          export GIT_TERMINAL_PROMPT=0
          FEEDS_LOG=/tmp/feeds.log
          : > $FEEDS_LOG
          set +e
          (
            set -e
            echo "=== feeds 前磁盘 ==="; df -h . | tail -1
            # r53: feeds 是外网 git 操作，无超时会静默悬挂。
            #   实证 2026-11-07 run 42338915465：feeds update 卡 51 分钟后 job 失败、日志未归档。
            #   加硬超时，把悬挂变成可诊断的快速失败。
            timeout 1200 ./scripts/feeds update -a || { echo "::error::feeds update 超时或失败（限 1200s）"; df -h .; exit 1; }
            bash $GITHUB_WORKSPACE/recipe/sh/RollbacktoDockerVersion.sh
            timeout 900 ./scripts/feeds install -a || { echo "::error::feeds install 超时或失败（限 900s）"; exit 1; }
            echo "=== feeds 后磁盘 ==="; df -h . | tail -1
          ) >> $FEEDS_LOG 2>&1
          RC=$?
          set -e
          cat $FEEDS_LOG
          exit $RC

      - name: 加载自定义配置
        working-directory: /workdir/openwrt
        run: |
          cp $GITHUB_WORKSPACE/recipe/ax6/banner package/base-files/files/etc/banner
          bash $GITHUB_WORKSPACE/recipe/sh/lean2.sh
          bash $GITHUB_WORKSPACE/recipe/sh/new_remove.sh

      - name: 自定义IMAGS格式 - meson8b cortex-a5+vfpv4
        working-directory: /workdir/openwrt
        run: |
          dos2unix $GITHUB_WORKSPACE/recipe/onecloud/files/etc/*.sh
          dos2unix $GITHUB_WORKSPACE/recipe/onecloud/files/etc/rc.*
          chmod -Rf 755 $GITHUB_WORKSPACE/recipe/onecloud/files/etc/*.sh
          chmod -Rf 755 $GITHUB_WORKSPACE/recipe/onecloud/files/etc/rc.*
          chmod -Rf 755 $GITHUB_WORKSPACE/recipe/onecloud/files/etc/init.d/*
          chmod -R 777 $GITHUB_WORKSPACE/recipe/onecloud/files/etc/aria2
          chmod -R 777 $GITHUB_WORKSPACE/recipe/onecloud/files/mnt/sda1/aria2
          chmod -R 777 $GITHUB_WORKSPACE/recipe/onecloud/files/mnt/sda1/aria2/download
          chmod -R 755 $GITHUB_WORKSPACE/recipe/onecloud/files/mnt/sda1/share

          # nikki feed 的 mihomo-alpha/mihomo-meta Makefile 互相依赖导致 make defconfig 报递归依赖，且 config 未选任何 nikki 包，直接移除
          rm -rf package/OpenWrt-nikki
          rm -rf ./tmp* ./.config*
          cp $GITHUB_WORKSPACE/${{ env.OWRT_CFG }} .config
          # r51: socat OpenSSL 显式预置（本线走 lean2.sh 配方，不经过 scripts/*/diy-part2.sh 的 1h 门禁；
          #   quicker-amlogic.config 只选 luci-app-socat，socat 由其依赖拉入，CONFIG_SOCAT_SSL 无默认值 → 恒 not set；
          #   packages feed net/socat/Makefile 在 SOCAT_SSL!=y 时传 --disable-openssl，编出的 socat 无 TLS 能力）
          #   放在 defconfig 之前，让 kconfig 从一开始就继承 y，避免事后补写被重算覆盖
          if grep -qx 'CONFIG_PACKAGE_luci-app-socat=y' .config || grep -qx 'CONFIG_PACKAGE_socat=y' .config; then
            grep -qx 'CONFIG_PACKAGE_socat=y' .config || echo 'CONFIG_PACKAGE_socat=y' >> .config
            sed -i '/^# CONFIG_SOCAT_SSL is not set$/d' .config
            grep -qx 'CONFIG_SOCAT_SSL=y' .config || echo 'CONFIG_SOCAT_SSL=y' >> .config
            sed -i '/^# CONFIG_PACKAGE_libopenssl is not set$/d' .config
            grep -qx 'CONFIG_PACKAGE_libopenssl=y' .config || echo 'CONFIG_PACKAGE_libopenssl=y' >> .config
            echo ">>> socat OpenSSL 预置: $(grep -E '^CONFIG_(PACKAGE_socat|SOCAT_SSL|PACKAGE_libopenssl)=' .config | tr '\n' ' ')"
          fi
          # r13.4: qmodem 全家显式禁用兜底（包源已剔除，防 config 显式选中残留）
          sed -i -E 's/^CONFIG_PACKAGE_(qmodem|luci-app-qmodem|luci-app-qmodem-next)=y$/# CONFIG_PACKAGE_\1 is not set/' .config
          # 用户决策弃用 fw3+legacy（与 25.12 对齐）：删除 legacy 后端用户态工具链，iptables 统一 nft 后端；
          # 补 nft 原生 tproxy/socket 内核模块（fullcone 配方已有 kmod-nft-fullcone）
          sed -i -E '/^CONFIG_PACKAGE_(iptables|ip6tables)-(mod-[a-z0-9-]+|zz-legacy|legacy)=y$/d' .config
          # fw4 完全体: miniupnpd 反转为 nftables 变体（与其他 14 线一致），fw4 防火墙断言
          sed -i -e 's/^CONFIG_PACKAGE_miniupnpd-iptables=y$/# CONFIG_PACKAGE_miniupnpd-iptables is not set/' \
                 -e 's/^CONFIG_PACKAGE_miniupnpd-nftables=n$/CONFIG_PACKAGE_miniupnpd-nftables=y/' .config
          grep -q '^CONFIG_PACKAGE_firewall4=y' .config || echo 'CONFIG_PACKAGE_firewall4=y' >> .config
          grep -q '^CONFIG_PACKAGE_miniupnpd-nftables=y' .config || echo 'CONFIG_PACKAGE_miniupnpd-nftables=y' >> .config
          # 清 fw3 时代 xt_ 死重内核模块（用户态工具已禁用；运行时保留 core/conntrack/nat/nat6/ipset/offload）
          sed -i -E '/^CONFIG_PACKAGE_kmod-ipt-(conntrack-extra|extra|iprange|ipsec|physdev|socket|tproxy)=y$/d' .config
          grep -q '^CONFIG_PACKAGE_iptables-nft=y' .config || echo 'CONFIG_PACKAGE_iptables-nft=y' >> .config
          grep -q '^CONFIG_PACKAGE_kmod-nft-tproxy=y' .config || echo 'CONFIG_PACKAGE_kmod-nft-tproxy=y' >> .config
          grep -q '^CONFIG_PACKAGE_kmod-nft-socket=y' .config || echo 'CONFIG_PACKAGE_kmod-nft-socket=y' >> .config
          echo "=== iptables 后端（弃用 legacy 后） ==="
          grep -E "^CONFIG_PACKAGE_iptables(-nft)?=" .config || true
          echo "=== meson8b 配置关键项 ==="
          grep -E "^CONFIG_TARGET_(amlogic|BOARD|SUBTARGET|PROFILE|DEVICE)" .config | head -8 || true

          if [ ! -d "./files" ]; then mkdir ./files; fi
          cp -rf $GITHUB_WORKSPACE/${{ env.OWRT_FILES }}/* ./files
          # 去掉多余的dhcp文件，让首次启动有dhcp服务
          rm -rf ./files/etc/config/dhcp

          # openclash 32 位内核（修复版：统一 meta(mihomo) 内核）
          bash $GITHUB_WORKSPACE/scripts/onecloud/openclash32-fixed.sh

          # python3：直接使用官方 feeds（Python 3 解释器位于 lang/python/python3）
          test -d feeds/packages/lang/python/python3 || { echo "::error::feeds/packages/lang/python/python3 缺失，OpenClash 依赖无法满足"; exit 1; }

          # 客户端模式网络配置
          bash $GITHUB_WORKSPACE/recipe/sh/edit_files.sh "${{ env.OWRT_IP }}" "${{ env.OWRT_SERVER_IP }}"

      - name: 下载编译环境
        working-directory: /workdir/openwrt
        run: |
          make defconfig
          # r50 守卫: socat 必须带 OpenSSL（TLS 终结能力）
          #   packages feed 的 net/socat/Makefile 在 CONFIG_SOCAT_SSL!=y 时传 --disable-openssl，
          #   编出的 socat -V 会显示 #undef WITH_OPENSSL，OPENSSL-LISTEN/CONNECT 不可用。
          #   本守卫放在 make defconfig 之后，兜住依赖重新求解。
          if grep -qx 'CONFIG_PACKAGE_socat=y' .config; then
            # 自愈一轮：defconfig 依赖重算若把 SOCAT_SSL 推回 not set，补写后重算一次再判
            if ! grep -qx 'CONFIG_SOCAT_SSL=y' .config || ! grep -qx 'CONFIG_PACKAGE_libopenssl=y' .config; then
              echo ">>> 守卫自愈：defconfig 未保住 socat OpenSSL，补写后重算"
              sed -i '/^# CONFIG_SOCAT_SSL is not set$/d' .config
              grep -qx 'CONFIG_SOCAT_SSL=y' .config || echo 'CONFIG_SOCAT_SSL=y' >> .config
              sed -i '/^# CONFIG_PACKAGE_libopenssl is not set$/d' .config
              grep -qx 'CONFIG_PACKAGE_libopenssl=y' .config || echo 'CONFIG_PACKAGE_libopenssl=y' >> .config
              make defconfig >/dev/null 2>&1 || true
            fi
            if ! grep -qx 'CONFIG_SOCAT_SSL=y' .config || ! grep -qx 'CONFIG_PACKAGE_libopenssl=y' .config; then
              echo "::error::socat 已选但缺 OpenSSL 支持，TLS 终结不可用（自愈一轮后仍未生效）"
              grep -E '^#? ?CONFIG_(SOCAT_SSL|PACKAGE_libopenssl)|^CONFIG_PACKAGE_socat=' .config || true
              exit 1
            fi
            echo "PASS⑭ socat OpenSSL 已开启（SOCAT_SSL=y + libopenssl=y）"
          else
            echo ">>> 本配置未选 socat，跳过 OpenSSL 守卫"
          fi
          # r13.4 守卫: qmodem 系不得被依赖链拉回（玩客云无 SIM 槽）
          if grep -qE '^CONFIG_PACKAGE_.*[Qq]modem=y' .config; then
            echo "::error::qmodem 系被依赖链拉回:"; grep -E '^CONFIG_PACKAGE_.*[Qq]modem' .config; exit 1
          fi
          # kconfig VARIANT 校正: make defconfig 把 .config 当默认建议，变体自动选择偏向 iptables，
          # 在 defconfig 定型后强制切回 nftables（后续 syncconfig 保留显式值）
          sed -i 's/^CONFIG_PACKAGE_miniupnpd-iptables=y$/# CONFIG_PACKAGE_miniupnpd-iptables is not set/' .config
          grep -q '^CONFIG_PACKAGE_miniupnpd-nftables=y' .config || echo 'CONFIG_PACKAGE_miniupnpd-nftables=y' >> .config
          # 守卫(弃用 legacy): defconfig 不得把 legacy 后端拉回
          if grep -qE '^CONFIG_PACKAGE_iptables-(legacy|zz-legacy)=y' .config; then
            echo "::error::legacy 后端被依赖链拉回（已弃用 fw3+legacy）:"; grep -E "iptables-legacy" .config | head -5; exit 1
          fi
          echo "=== amlogic target 守卫（defconfig 后必须保留） ==="
          grep -E "^CONFIG_TARGET_amlogic=y" .config || { echo "::error::amlogic target 被 defconfig 清除，注入失败"; exit 1; }
          # 单网口精简守卫：fw3 与 kmod-ipt-ipset 不得被依赖链拉回
          # （offload/nat/nat6/compat/odhcpd 为 turboacc/dnsmasq-full-dhcpv6/iptables-nft 锁定依赖，白名单放行）
          if grep -qE '^CONFIG_PACKAGE_(firewall|kmod-ipt-ipset)=y' .config; then
            echo "::error::单网口精简失败，以下包被依赖链拉回:"
            grep -E '^CONFIG_PACKAGE_(firewall|kmod-ipt-ipset)=y' .config
            exit 1
          fi
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 内核准备（提前暴露补丁/依赖问题）
        working-directory: /workdir/openwrt
        timeout-minutes: 40
        continue-on-error: true
        run: |
          set +e
          stdbuf -oL -eL make -j$(nproc) target/linux/prepare V=s 2>&1 | stdbuf -oL tee prepare.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::warning::target/linux/prepare 失败 rc=$RC，以下为关键行（构建继续，供对照）"
            grep -nE 'Hunk|hunk|patch|Patch|fuzz|Rejected|Error|error:' prepare.log | tail -n 60 || true
          else
            echo ">>> 内核准备通过"
          fi

      - name: 编译固件
        working-directory: /workdir/openwrt
        timeout-minutes: 300
        run: |
          echo -e "$(nproc) thread compile"
          : > build.log
          set +e
          stdbuf -oL -eL make -j$(nproc) 2>&1 | stdbuf -oL tee build.log
          RC=${PIPESTATUS[0]}
          set -e
          # 兜底只认内存耗尽：其余失败重跑 -j1 只会把 108min 变 216min，还把真因埋掉
          if [ "$RC" -ne 0 ] && grep -qE 'virtual memory exhausted|internal compiler error: Killed|Killed signal|Cannot allocate memory|out of memory' build.log; then
            echo "::warning::疑似内存耗尽（rc=$RC），降 -j1 重试，日志追加"
            set +e
            stdbuf -oL -eL make -j1 2>&1 | stdbuf -oL tee -a build.log
            RC=${PIPESTATUS[0]}
            set -e
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::warning::编译失败 rc=$RC，用 V=s 复跑失败目标以定位（输出追加进 build.log）"
            _tgt=$(grep -oE '\-C [^ ]+ compile' build.log | tail -1 | awk '{print $2}')
            echo ">>> 失败目标推断: ${_tgt:-未知}"
            set +e
            if [ -n "$_tgt" ]; then
              stdbuf -oL -eL make -j1 V=s "$_tgt/compile" 2>&1 | stdbuf -oL tee -a build.log
            else
              stdbuf -oL -eL make -j1 V=s 2>&1 | stdbuf -oL tee -a build.log
            fi
            set -e
            echo "::error::编译失败 rc=$RC，build.log 末尾 150 行："
            tail -n 150 build.log
            exit "$RC"
          fi
          echo ">>> 编译完成，build.log 行数: $(wc -l < build.log)"

      - name: 构建摘要
        if: always()
        working-directory: /workdir/openwrt
        run: |
          {
            echo "## 构建摘要"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 分支 | ${REPO_BRANCH} |"
            echo "| 版本戳 | ${OWRT_DATE} |"
            for _f in outfile/*.tar.gz outfile/*.tar outfile/*.img.xz; do
              if [ -f "$_f" ]; then echo "| 产物 | $(basename "$_f") ($(du -h "$_f" | cut -f1)) |"; fi
            done || true
          } >> $GITHUB_STEP_SUMMARY

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@main
        with:
          name: build-log-onecloud-${{ env.REPO_BRANCH }}-${{ env.OWRT_DATE }}
          path: |
            openwrt/build.log
            openwrt/.config
          retention-days: 7
          if-no-files-found: warn

      - name: 制作直刷包
        run: |
          bash $GITHUB_WORKSPACE/recipe/sh/convert3.sh
          echo "=== 直刷包产物 ==="
          ls -lh openwrt/bin/targets/*/*/*.burn.img.xz 2>/dev/null || true

      - name: 整理固件
        id: organize
        run: |
          cd openwrt
          mkdir outfile
          cp -rf bin/targets/*/*/*.tar ./outfile
          cp -rf bin/targets/*/*/*.xz ./outfile
          cp -rf .config ./outfile/config.txt
          rm -rf bin/targets/*/*/packages

          cd outfile
          if [[ $REPO_URL == *"immortalwrt"* ]]; then
            gzip *.tar
          fi

          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          ls -lh $PWD

      - name: 上传 artifacts
        uses: actions/upload-artifact@main
        with:
          name: onecloud-${{ env.REPO_BRANCH }}-${{ env.OWRT_DATE }}
          path: openwrt/outfile/*
          retention-days: 15

      - name: 上传直刷固件
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: OneCloud_${{ env.REPO_BRANCH }}_${{ env.OWRT_DATE }}
          body: |
            玩客云（OneCloud S805）一站式直刷固件
            请使用双USB公头线刷机！
            ========== 基本信息 ==========
            源码：immortalwrt
            分支：${{ env.REPO_BRANCH }}
            默认密码：password
            默认地址：${{ env.OWRT_IP }}
          artifacts: "openwrt/outfile/*"

      - name: 缓存额度治理
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # r55：原实现用 `gh cache list --json ... -q`，在本 runner 上不产出内容，
          #   管道空转 → 一条缓存也没删（实测 run 42478524723 治理前后列表完全相同）。
          #   改为 gh api 取原始 JSON + python3 解析，逐条删除并打印 rc/错误。
          python3 - "${{ github.repository }}" "${REPO_BRANCH}" <<'PY'
          import json, subprocess, sys

          repo, br = sys.argv[1], sys.argv[2]


          def api(path, method='GET'):
              r = subprocess.run(['gh', 'api', '-X', method, path], capture_output=True, text=True)
              return r.returncode, r.stdout, r.stderr


          rc, out, err = api('/repos/%s/actions/caches?per_page=100' % repo)
          if rc != 0:
              print('::warning::读取缓存列表失败 rc=%d %s' % (rc, err[:200]))
              raise SystemExit(0)
          items = json.loads(out or '{}').get('actions_caches', [])
          total = sum(x['size_in_bytes'] for x in items) / 1073741824
          print('=== 治理前：%d 条，合计 %.2f GB ===' % (len(items), total))
          for x in sorted(items, key=lambda y: -y['size_in_bytes'])[:8]:
              print('  %6.2f GB  %s' % (x['size_in_bytes'] / 1073741824, x['key'][:66]))


          def rm(why, x):
              rc, out, err = api('/repos/%s/actions/caches/%s' % (repo, x['id']), 'DELETE')
              print('  删 %-18s %6.2f GB rc=%d %s' % (why, x['size_in_bytes'] / 1073741824, rc,
                                                    (err or '').strip()[:90]))


          # ① dl：同分支只留最新（跨月旧 key 是最大浪费，实测有一条 2.61 GB 的 202610）
          dl = sorted([x for x in items if x['key'].startswith('dl-%s-' % br)],
                      key=lambda x: x['created_at'], reverse=True)
          for x in dl[1:]:
              rm('dl 旧条目', x)
          # ② cachewrtbuild：key 含 run_id，每轮新增一条，只留最新
          am = sorted([x for x in items if x['key'].startswith('amlogic6.6/')],
                      key=lambda x: x['created_at'], reverse=True)
          for x in am[1:]:
              rm('cachewrtbuild 旧', x)
          # ③ 源码指纹：留最近 6 条
          fp = sorted([x for x in items if x['key'].startswith('fp-')],
                      key=lambda x: x['created_at'], reverse=True)
          for x in fp[6:]:
              rm('指纹旧条目', x)

          rc, out, err = api('/repos/%s/actions/caches?per_page=100' % repo)
          if rc == 0:
              items = json.loads(out or '{}').get('actions_caches', [])
              print('=== 治理后：%d 条，合计 %.2f GB ===' % (
                  len(items), sum(x['size_in_bytes'] for x in items) / 1073741824))
          PY
      - name: 记录源码指纹（仅全流程成功）
        if: success() && needs.check-updates.outputs.fingerprint != ''
        run: |
          mkdir -p .fp
          echo "${{ needs.check-updates.outputs.fingerprint }}" > .fp/fingerprint
          cat .fp/fingerprint

      - name: 保存源码指纹
        if: success() && needs.check-updates.outputs.fingerprint != ''
        uses: actions/cache/save@v5
        with:
          path: .fp
          key: fp-${{ env.REPO_BRANCH }}-${{ needs.check-updates.outputs.fingerprint }}

      - name: SSH 调试
        if: failure() && inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
