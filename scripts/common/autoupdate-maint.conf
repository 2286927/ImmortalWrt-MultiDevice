# /etc/config/autoupdate-maint —— autoupdate-maint 运行配置（出厂默认值）
# 刷机保留配置时，overlay 里改过的版本优先，本文件只作首次安装的兜底
# 由 D:\我的知识库\OpenWrt编译\autoupdate-maint-20261113 维护，改动请同步回仓库 scripts/

# ---- 目标仓库 ----
REPO_OWNER="2286927"
REPO_NAME="ImmortalWrt-MultiDevice"
FILE_PATH="scripts/common/autoupdate.sh"
BRANCH="main"

# ---- 凭据 ----
TOKEN_FILE="/etc/config/.gh_token"

# ---- 状态 ----
STATE_FILE="/etc/autoupdate-maint.state"

# ---- 判定阈值 ----
INTERVAL_DAYS=7
COOLDOWN_HOURS=6

# ---- 探测参数 ----
PROBE_TIMEOUT=12
PROBE_ROUNDS=2
MIN_SPEED_KBPS=80
BIGFILE_BYTES=10000000

# ---- 探测目标的资产坐标（镜像前缀会拼在完整 GitHub URL 之前）----
ASSET_TAG="autoupdate"
ASSET_PREFIX="autoupdate-R68S-25.12"

# 全部候选不可用时的策略：
#   keep_last    保持现有列表不动，只记 fail_streak（默认，推荐）
#   direct_only  降级为仅直连（注意：直连实测不可用）
FALLBACK="keep_last"

# ---- 候选池（写域名，不带协议与斜杠）----
# 前 4 个是 2026-11-12 实测可用；其余保留用于探测是否复活
CANDIDATES="ghfast.top ghproxy.imciel.com gh.monlor.com gh-proxy.com gh-proxy.org ghproxy.net gh.llkk.cc mirror.ghproxy.com ghproxy.cfd ghproxy.cc"

# 大文件测速轮数（取最大值，抗瞬时拥塞）
SPEED_ROUNDS=2
